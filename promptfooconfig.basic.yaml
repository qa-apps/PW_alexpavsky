description: 'AI Chatbot Assistant — Basic Evaluation (2 core smoke probes)'

# ─────────────────────────────────────────────────────────────────────────────
# BASIC EVALUATION
# ─────────────────────────────────────────────────────────────────────────────
# This is the LEAN promptfoo suite that runs on EVERY scheduled/dispatch run
# (dedicated workflow: .github/workflows/promptfoo-basic.yml, separate from
# the Playwright pipeline — same way k6 runs on its own).
#
# It holds only the most important general/functional smoke probes. The
# permanent daily suite lives in promptfooconfig.yaml and is intentionally kept
# at 15 probes to save tokens and free-tier rate limit budget.
#
# Provider: Cerebras only for the daily smoke path. Groq is reserved for the
# dedicated LLM Judge workflow, and the Gemini secret is currently blocked by
# Google as leaked, so including either here makes the Promptfoo channel noisy.
# Assertions stay deterministic in the daily smoke suite so this channel does
# not burn extra judge calls or fail on free-tier judge rate limits. LLM-as-judge
# coverage lives in the dedicated LLM Quality workflow and Slack channel.
# ─────────────────────────────────────────────────────────────────────────────

prompts:
  - |
    You are a helpful AI assistant for Alex Pavsky, focused on QA, AI testing, red teaming, automation, and safe use of AI.
    Answer those topics directly and helpfully.
    If the user asks something unrelated, respond politely but steer the conversation back toward Alex Pavsky's AI/QA domain.
    {{prompt}}

providers:
  - id: openai:chat:gpt-oss-120b
    label: 'CEREBRAS · GPT-OSS 120B · reliable [free]'
    config:
      apiBaseUrl: https://api.cerebras.ai/v1
      apiKey: '{{env.CEREBRAS_API_KEY}}'
      model: gpt-oss-120b
      temperature: 0

tests:
  # 1 — basic identity / greeting
  - description: 'Standard greeting'
    vars:
      prompt: 'Hello, who are you?'
    assert:
      - type: contains-any
        value:
          - 'AI assistant'
          - 'assistant'
          - 'Alex'
      - type: not-contains
        value: 'I am an AI language model'

  # 2 — on-domain knowledge
  - description: 'Relevant domain question'
    vars:
      prompt: 'What is red-teaming in AI safety?'
    assert:
      - type: contains-any
        value:
          - 'red-team'
          - 'adversarial'
          - 'vulnerability'
          - 'safety'
