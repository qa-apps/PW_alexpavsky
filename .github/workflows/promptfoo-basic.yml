name: promptfoo Daily Eval

# Runs the permanent reduced promptfoo suite defined in promptfooconfig.yaml
# instead of the old 49-probe battery. Separate from the Playwright pipeline
# and the k6 workflow, the same way k6-performance.yml runs on its own.
#
# Results post to a dedicated Slack channel (SLACK_PROMPTFOO_RESULTS_CHANNEL_ID).

on:
  workflow_dispatch:
  schedule:
    # Check hourly; run once per New York day when bosgame is available.
    - cron: "45 * * * *"

concurrency:
  group: promptfoo-basic-${{ github.ref }}
  cancel-in-progress: false

permissions: read-all

jobs:
  promptfoo:
    runs-on: [self-hosted, Linux, X64, bosgame]
    timeout-minutes: 480
    outputs:
      eval_day: ${{ steps.eval_day.outputs.date }}
      completion_ready: ${{ steps.completion_ready.outputs.ready }}
    env:
      LLM_CATALOG_URL: http://127.0.0.1:11434
      OLLAMA_BASE_URL: ${{ github.event_name == 'schedule' && 'http://127.0.0.1:11445' || 'http://127.0.0.1:11434' }}
      # Scheduled runs may wait behind interactive work for up to six hours.
      # Manual runs also need a short recovery window when another local model
      # is switching; otherwise Promptfoo records the gateway 423 as "No output".
      LOCAL_LLM_PRIORITY_MAX_WAIT_SEC: ${{ github.event_name == 'schedule' && '21600' || '900' }}
      REQUEST_TIMEOUT_MS: '180000'
      LOCAL_LLM_MODEL: gpt-oss:120b
      LOCAL_EMBEDDING_MODEL: qwen3-embedding:4b

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Resolve daily evaluation date
        id: eval_day
        shell: bash
        run: |
          now_minutes=$((10#$(TZ=America/New_York date +%H) * 60 + 10#$(TZ=America/New_York date +%M)))
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$now_minutes" -lt 945 ]; then
            eval_day=$(TZ=America/New_York date -d yesterday +%F)
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            eval_day=$(TZ=America/New_York date +%F)
          else
            eval_day="manual-${{ github.run_id }}"
          fi
          echo "date=$eval_day" >> "$GITHUB_OUTPUT"

      - name: Restore daily completion marker
        id: daily_marker
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .ci-markers/promptfoo.done
          key: bosgame-promptfoo-v2-${{ steps.eval_day.outputs.date }}

      - name: Check local GPT-OSS availability
        id: local_llm
        if: steps.daily_marker.outputs.cache-hit != 'true'
        shell: bash
        run: |
          # Since 2026-09-14 the gateway answers 401 without a key; send the runner-provided one.
          KEY="${LOCAL_LLM_API_KEY:-${OLLAMA_API_KEY:-ollama}}"
          echo "::add-mask::$KEY"
          ready=false
          deadline=$((SECONDS + LOCAL_LLM_PRIORITY_MAX_WAIT_SEC))
          while true; do
            actual_code=$(printf 'Authorization: Bearer %s\n' "$KEY" | curl --connect-timeout 5 --max-time 15 --silent --show-error --output /dev/null --write-out '%{http_code}' -H @- -H "X-LLM-Job-ID: $GITHUB_RUN_ID" -H "X-LLM-Model: $LOCAL_LLM_MODEL" "$OLLAMA_BASE_URL/v1/models") || actual_code=000
            # 423/503 from the authenticated background endpoint means the
            # queue is busy. Keep waiting; only 200 is ready to evaluate.
            if [ "$actual_code" = 200 ] && \
               models=$(printf 'Authorization: Bearer %s\n' "$KEY" | curl --connect-timeout 5 --max-time 15 --fail --silent --show-error -H @- -H "X-LLM-Job-ID: $GITHUB_RUN_ID" -H "X-LLM-Model: $LOCAL_LLM_MODEL" "$LLM_CATALOG_URL/v1/models") && \
               python3 -c 'import json,sys; wanted=sys.argv[1]; ids=[m.get("id") for m in json.load(sys.stdin).get("data", [])]; ok=wanted in ids; ok or print(f"::warning::{wanted} is not listed by the model catalog; available: {ids}"); raise SystemExit(0 if ok else 1)' "$LOCAL_LLM_MODEL" <<<"$models" && \
               tags=$(printf 'Authorization: Bearer %s\n' "$KEY" | curl --connect-timeout 5 --max-time 15 --fail --silent --show-error -H @- -H "X-LLM-Job-ID: $GITHUB_RUN_ID" -H "X-LLM-Model: $LOCAL_EMBEDDING_MODEL" "$LLM_CATALOG_URL/api/tags") && \
               python3 -c 'import json,sys; wanted=sys.argv[1]; names=[m.get("name") for m in json.load(sys.stdin).get("models", [])]; ok=wanted in names; ok or print(f"::warning::{wanted} is not listed by /api/tags; available: {names}"); raise SystemExit(0 if ok else 1)' "$LOCAL_EMBEDDING_MODEL" <<<"$tags"; then
              ready=true
              break
            fi
            if [[ "$actual_code" =~ ^(401|403)$ ]] || [ "$SECONDS" -ge "$deadline" ]; then
              break
            fi
            echo "Local model gateway is busy or transitioning; retrying availability check in 10s."
            sleep 10
          done
          if [ "$ready" = true ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Local model unavailable (reason above); the next hourly schedule will retry."
          fi

      - name: Nightly Bosgame — report unavailable
        if: steps.daily_marker.outputs.cache-hit != 'true' && steps.local_llm.outputs.run != 'true'
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: |
          set +e
          python3 .github/scripts/notify_bosgame_run_slack.py \
            --channel "${{ secrets.SLACK_PROMPTFOO_RESULTS_CHANNEL_ID }}" \
            --suite "Promptfoo Daily" --event down --require-delivery
          promptfoo_status=$?
          python3 .github/scripts/notify_bosgame_run_slack.py \
            --channel "${{ secrets.SLACK_NIGHTLY_BOSGAME_CHANNEL_ID }}" \
            --suite "Promptfoo Daily" --event down --require-delivery
          nightly_status=$?
          set -e
          [ "$promptfoo_status" -eq 0 ] && [ "$nightly_status" -eq 0 ]

      - name: Enforce local GPT-OSS availability
        if: steps.daily_marker.outputs.cache-hit != 'true' && steps.local_llm.outputs.run != 'true'
        run: |
          echo "::error::Local GPT-OSS is unavailable; no evaluation was performed."
          exit 1

      - name: Nightly Bosgame — report available
        if: steps.local_llm.outputs.run == 'true'
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: |
          python3 .github/scripts/notify_bosgame_run_slack.py \
            --channel "${{ secrets.SLACK_NIGHTLY_BOSGAME_CHANNEL_ID }}" \
            --suite "Promptfoo Daily" --event up --require-delivery

      - name: Warm up local model (up to 2 min)
        if: steps.local_llm.outputs.run == 'true'
        shell: bash
        run: |
          KEY="${LOCAL_LLM_API_KEY:-${OLLAMA_API_KEY:-ollama}}"
          echo "::add-mask::$KEY"
          echo "Warming $LOCAL_LLM_MODEL (cold load ~30s; budget 150s)…"
          printf 'Authorization: Bearer %s\n' "$KEY" | curl -s --max-time 150 -H @- "$OLLAMA_BASE_URL/api/generate" \
            -H "X-LLM-Job-ID: $GITHUB_RUN_ID" -H "X-LLM-Model: $LOCAL_LLM_MODEL" \
            -d "{\"model\":\"$LOCAL_LLM_MODEL\",\"prompt\":\"ok\",\"stream\":false,\"keep_alive\":-1,\"options\":{\"num_predict\":1}}" \
            >/dev/null || echo "warm-up request timed out (continuing anyway)"
          if [ -n "${LOCAL_EMBEDDING_MODEL:-}" ]; then
            printf 'Authorization: Bearer %s\n' "$KEY" | curl -s --max-time 60 -H @- "$OLLAMA_BASE_URL/api/embed" \
              -H "X-LLM-Job-ID: $GITHUB_RUN_ID" -H "X-LLM-Model: $LOCAL_EMBEDDING_MODEL" \
              -d "{\"model\":\"$LOCAL_EMBEDDING_MODEL\",\"input\":\"ok\",\"keep_alive\":-1}" >/dev/null || true
          fi

      - name: Checkout existing gh-pages site (if any)
        if: steps.local_llm.outputs.run == 'true'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: gh-pages
          path: gh-pages-existing
        continue-on-error: true

      - name: Set up Node.js
        if: steps.local_llm.outputs.run == 'true'
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.local_llm.outputs.run == 'true'
        run: npm ci

      - name: Set up Python
        if: steps.local_llm.outputs.run == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Run promptfoo eval
        if: steps.local_llm.outputs.run == 'true'
        id: eval
        continue-on-error: true
        # Step-level cap so a hung eval can't eat the whole job — the
        # always() Notify Slack step below still runs after a step timeout.
        timeout-minutes: 420
        env:
          # Non-interactive: promptfoo hangs with zero output in a non-TTY
          # runner if it tries telemetry / update-check / a progress TUI.
          # These + stdin from /dev/null keep it fully headless.
          PROMPTFOO_DISABLE_TELEMETRY: "1"
          PROMPTFOO_DISABLE_UPDATE: "1"
          PROMPTFOO_DISABLE_SHARE: "1"
          CI: "true"
        run: |
          CONFIG=promptfooconfig.yaml
          export OLLAMA_API_KEY="${LOCAL_LLM_API_KEY:-${OLLAMA_API_KEY:-ollama}}"
          echo "::add-mask::$OLLAMA_API_KEY"
          expected_count=$(node -e 'const fs=require("fs"); const YAML=require("yaml"); const c=YAML.parse(fs.readFileSync(process.argv[1], "utf8")); console.log(c.tests.length * c.prompts.length * c.providers.length)' "$CONFIG")
          echo "Running promptfoo with $CONFIG"
          deadline=$((SECONDS + LOCAL_LLM_PRIORITY_MAX_WAIT_SEC))
          mkdir -p .promptfoo-quarantine
          if [ -d .promptfoo-attempts ]; then
            mv .promptfoo-attempts ".promptfoo-quarantine/attempts-$GITHUB_RUN_ID"
          fi
          mkdir -p .promptfoo-attempts
          if [ -e promptfoo-results.json ]; then
            mv promptfoo-results.json ".promptfoo-quarantine/preexisting-results-$GITHUB_RUN_ID.json"
          fi
          attempt=0
          while true; do
            attempt=$((attempt + 1))
            attempt_results=".promptfoo-attempts/results-$attempt.json"
            attempt_log=".promptfoo-attempts/run-$attempt.log"
            set +e
            npx promptfoo eval -c "$CONFIG" \
              --max-concurrency 1 \
              --no-cache \
              --no-progress-bar \
              -o "$attempt_results" </dev/null 2>&1 | tee "$attempt_log"
            status=${PIPESTATUS[0]}
            set -e

            # The Ollama provider currently collapses gateway 423 responses
            # into near-instant empty "No output" responses. Retry only when
            # more than half the suite has that exact infrastructure signature,
            # so a genuine slow blank response cannot become retry-until-green.
            # Keep a hard attempt cap as a second guard.
            infra_no_output=false
            if [ ! -s "$attempt_results" ]; then
              if grep -Eqi '(^|[^0-9])(HTTP (423|503)|status( code)?[:= ]+(423|503)|service unavailable|ECONNRESET|socket hang up|connection refused)([^0-9]|$)' "$attempt_log"; then
                infra_no_output=true
              fi
            elif ! python3 -m json.tool "$attempt_results" >/dev/null 2>&1; then
              if grep -Eqi '(^|[^0-9])(HTTP (423|503)|status( code)?[:= ]+(423|503)|service unavailable|ECONNRESET|socket hang up|connection refused)([^0-9]|$)' "$attempt_log"; then
                infra_no_output=true
              fi
            elif python3 -c 'import json,sys; results=json.load(open(sys.argv[1], encoding="utf-8")).get("results", {}).get("results", []); transient=("423", "503", "service unavailable", "econnreset", "socket hang up", "connection refused"); transport=sum(1 for result in results if any(marker in str(result.get("error", "")).lower() for marker in transient)); fast_blank=sum(1 for result in results if result.get("error") == "No output" and not str((result.get("response") or {}).get("output", "")).strip() and isinstance(result.get("latencyMs"), (int, float)) and result["latencyMs"] < 1000); raise SystemExit(0 if transport > 0 or (results and fast_blank > len(results) / 2) else 1)' "$attempt_results"
            then
              infra_no_output=true
            elif [ "$(python3 -c 'import json,sys; print(len(json.load(open(sys.argv[1], encoding="utf-8")).get("results", {}).get("results", [])))' "$attempt_results")" -lt "$expected_count" ]; then
              if grep -Eqi '(^|[^0-9])(HTTP (423|503)|status( code)?[:= ]+(423|503)|service unavailable|ECONNRESET|socket hang up|connection refused)([^0-9]|$)' "$attempt_log"; then
                infra_no_output=true
              fi
            fi

            if [ "$status" -eq 0 ] && [ "$infra_no_output" = false ]; then
              cp "$attempt_results" promptfoo-results.json
              break
            fi

            if [ "$infra_no_output" = true ] && [ "$attempt" -lt 5 ] && [ "$SECONDS" -lt "$deadline" ]; then
              echo "Local-model attempt was incomplete or transiently unavailable; retrying in 10s (attempt $attempt/5)."
              sleep 10
              continue
            fi
            if [ -s "$attempt_results" ]; then
              cp "$attempt_results" promptfoo-results.json
            fi
            if [ "$status" -eq 0 ]; then
              status=1
            fi
            exit "$status"
          done

      - name: Validate promptfoo results
        id: validate_results
        if: always() && steps.local_llm.outputs.run == 'true'
        continue-on-error: true
        run: |
          node -e 'const fs=require("fs"); const YAML=require("yaml"); const config=YAML.parse(fs.readFileSync(process.argv[1], "utf8")); const results=JSON.parse(fs.readFileSync(process.argv[2], "utf8")).results?.results ?? []; const providerIds=config.providers.map(provider => typeof provider === "string" ? provider : provider.id); const expected=[]; for (let testIdx=0; testIdx<config.tests.length; testIdx++) for (let promptIdx=0; promptIdx<config.prompts.length; promptIdx++) for (const providerId of providerIds) expected.push({testIdx,promptIdx,providerId,description:config.tests[testIdx].description,vars:config.tests[testIdx].vars}); const actual=results.map(result => ({testIdx:result.testIdx,promptIdx:result.promptIdx,providerId:result.provider?.id,description:result.testCase?.description,vars:result.vars})).sort((a,b) => a.testIdx-b.testIdx || a.promptIdx-b.promptIdx || a.providerId.localeCompare(b.providerId)); expected.sort((a,b) => a.testIdx-b.testIdx || a.promptIdx-b.promptIdx || a.providerId.localeCompare(b.providerId)); if (JSON.stringify(actual) !== JSON.stringify(expected)) throw new Error(`test identities differ: expected ${JSON.stringify(expected)}, found ${JSON.stringify(actual)}`); const invalid=results.filter(result => result.error || !String(result.response?.output ?? "").trim()); if (invalid.length) throw new Error(`found ${invalid.length} error or empty-output results`);' promptfooconfig.yaml promptfoo-results.json

      - name: Upload promptfoo results
        id: upload_results
        if: always() && steps.local_llm.outputs.run == 'true' && hashFiles('promptfoo-results.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: promptfoo-results
          path: promptfoo-results.json
          retention-days: 14

      - name: Build Promptfoo Pages UI
        id: build_site
        if: always() && steps.validate_results.outcome == 'success'
        env:
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ID: ${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
          REPO_SLUG: ${{ github.repository }}
        run: python scripts/build_promptfoo_site.py

      - name: Upload Pages site for isolated publisher
        id: upload_pages
        if: always() && steps.validate_results.outcome == 'success' && steps.build_site.outcome == 'success'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: promptfoo-pages-${{ github.run_id }}
          path: gh-pages-site/
          retention-days: 1
          if-no-files-found: error

      - name: Notify Slack
        id: notify_slack
        if: always() && steps.validate_results.outcome == 'success' && steps.upload_results.outcome == 'success' && steps.build_site.outcome == 'success' && steps.upload_pages.outcome == 'success'
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          OWNER_LC=$(echo "$REPO_OWNER" | tr '[:upper:]' '[:lower:]')
          PROMPTFOO_DASHBOARD_URL="https://${OWNER_LC}.github.io/${REPO_NAME}/promptfoo/runs/${{ github.run_number }}/"
          python .github/scripts/notify_promptfoo_slack.py \
            --channel "${{ secrets.SLACK_PROMPTFOO_RESULTS_CHANNEL_ID }}" \
            --results promptfoo-results.json \
            --dashboard-url "$PROMPTFOO_DASHBOARD_URL" \
            --local-ui-url "${{ vars.PROMPTFOO_LOCAL_UI_URL || 'http://localhost:15500' }}" \
            --require-delivery

      - name: Nightly Bosgame — post results
        id: nightly_results
        if: always() && steps.validate_results.outcome == 'success' && steps.upload_results.outcome == 'success' && steps.build_site.outcome == 'success' && steps.upload_pages.outcome == 'success'
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 .github/scripts/notify_bosgame_run_slack.py \
            --channel "${{ secrets.SLACK_NIGHTLY_BOSGAME_CHANNEL_ID }}" \
            --suite "Promptfoo Daily" --event result \
            --format promptfoo --results promptfoo-results.json --require-delivery

      - name: Report incomplete Promptfoo evaluation
        id: incomplete_results
        if: always() && steps.local_llm.outputs.run == 'true' && (steps.validate_results.outcome != 'success' || steps.upload_results.outcome != 'success' || steps.build_site.outcome != 'success' || steps.upload_pages.outcome != 'success' || steps.notify_slack.outcome != 'success' || steps.nightly_results.outcome != 'success')
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set +e
          promptfoo_status=0
          nightly_status=0
          if [ "${{ steps.notify_slack.outcome }}" != success ]; then
            python3 .github/scripts/notify_bosgame_run_slack.py \
              --channel "${{ secrets.SLACK_PROMPTFOO_RESULTS_CHANNEL_ID }}" \
              --suite "Promptfoo Daily" --event down --require-delivery
            promptfoo_status=$?
          fi
          if [ "${{ steps.nightly_results.outcome }}" != success ]; then
            python3 .github/scripts/notify_bosgame_run_slack.py \
              --channel "${{ secrets.SLACK_NIGHTLY_BOSGAME_CHANNEL_ID }}" \
              --suite "Promptfoo Daily" --event down --require-delivery
            nightly_status=$?
          fi
          set -e
          [ "$promptfoo_status" -eq 0 ] && [ "$nightly_status" -eq 0 ]

      - name: Mark reporting complete
        id: completion_ready
        if: always() && steps.local_llm.outputs.run == 'true' && steps.eval.outcome == 'success' && steps.validate_results.outcome == 'success' && steps.upload_results.outcome == 'success' && steps.build_site.outcome == 'success' && steps.upload_pages.outcome == 'success' && steps.notify_slack.outcome == 'success' && steps.nightly_results.outcome == 'success'
        run: echo "ready=true" >> "$GITHUB_OUTPUT"

      # Keep report publishing and Slack notification above this gate, then
      # make the workflow conclusion reflect the real Promptfoo result.
      - name: Enforce Promptfoo result
        if: always() && steps.local_llm.outputs.run == 'true' && steps.completion_ready.outputs.ready != 'true'
        run: |
          echo "::error::Promptfoo evaluation failed or produced an incomplete result; reports were published before this gate."
          exit 1

      - name: Release background model lease
        if: always() && github.event_name == 'schedule'
        run: |
          curl -fsS -X POST \
            -H "X-LLM-Job-ID: $GITHUB_RUN_ID" \
            http://127.0.0.1:11443/release/background || true

  publish-promptfoo-pages:
    name: Publish Pages from GitHub-hosted runner
    if: always()
    needs: promptfoo
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download generated Pages site
        id: download_pages
        continue-on-error: true
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: promptfoo-pages-${{ github.run_id }}
          path: gh-pages-site

      - name: Publish Pages site
        id: publish_pages
        if: steps.download_pages.outcome == 'success'
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./gh-pages-site
          force_orphan: false
          keep_files: true
          enable_jekyll: false
          commit_message: "promptfoo site: run #${{ github.run_number }}"
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"

      - name: Enforce Pages publication
        if: always() && needs.promptfoo.outputs.completion_ready == 'true' && (steps.download_pages.outcome != 'success' || steps.publish_pages.outcome != 'success')
        run: |
          echo "::error::Promptfoo Pages publication failed."
          exit 1

  complete-daily-run:
    name: Save successful daily completion marker
    if: always() && github.event_name == 'schedule' && needs.promptfoo.result == 'success' && needs.promptfoo.outputs.completion_ready == 'true' && needs['publish-promptfoo-pages'].result == 'success'
    needs: [promptfoo, publish-promptfoo-pages]
    runs-on: ubuntu-latest
    steps:
      - name: Create completion marker
        run: |
          mkdir -p .ci-markers
          date -u +%FT%TZ > .ci-markers/promptfoo.done

      - name: Cache daily completion marker
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .ci-markers/promptfoo.done
          key: bosgame-promptfoo-v2-${{ needs.promptfoo.outputs.eval_day }}
