name: Auto-fix Agent

on:
  workflow_run:
    workflows:
      - "Playwright CI (deterministic tests)"
      - "LLM Quality (LLM Judge tests)"
      - "LLM Eval Nightly (Ragas + Giskard)"
      - "Daily Design Check (visual + structural regression)"
      - "Daily Agentic Vision Audit"
      - "k6 Performance"
      - "promptfoo Daily Eval"
      - "Agent Observability Dashboards"
    types: [completed]
  workflow_dispatch:
    inputs:
      failed_run_id:
        description: "Failed GitHub Actions run ID to investigate"
        required: true
        type: string
      auto_merge:
        description: "Allow merge after all local and cloud gates pass"
        required: false
        type: boolean
        default: true
      reviewer_smoke:
        description: "Call local, OpenAI, and DeepSeek reviewers without creating a PR"
        required: false
        type: boolean
        default: false
      vision_smoke:
        description: "Run the agentic Vision audit without creating a PR"
        required: false
        type: boolean
        default: false

concurrency:
  group: auto-fix-${{ github.event.workflow_run.id || inputs.failed_run_id }}-${{ inputs.reviewer_smoke || false }}-${{ inputs.vision_smoke || false }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

jobs:
  # Gate job runs unconditionally so the workflow conclusion is "success"
  # instead of "skipped" when there's nothing to fix. Without this,
  # every passing upstream run produced a "Run skipped" email.
  gate:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.decide.outputs.should_run }}
      needs_human: ${{ steps.decide.outputs.needs_human }}
      run_id: ${{ steps.decide.outputs.run_id }}
      run_url: ${{ steps.decide.outputs.run_url }}
      pipeline: ${{ steps.decide.outputs.pipeline }}
      head_sha: ${{ steps.decide.outputs.head_sha }}
      head_branch: ${{ steps.decide.outputs.head_branch }}
    steps:
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
          INPUT_RUN_ID: ${{ inputs.failed_run_id }}
          EVENT_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          EVENT_RUN_URL: ${{ github.event.workflow_run.html_url }}
          EVENT_PIPELINE: ${{ github.event.workflow_run.name }}
          EVENT_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          EVENT_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          REVIEWER_SMOKE: ${{ inputs.reviewer_smoke }}
          VISION_SMOKE: ${{ inputs.vision_smoke }}
        shell: bash
        run: |
          run_id="$EVENT_RUN_ID"
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            run_id="$INPUT_RUN_ID"
            data=$(gh api "repos/${{ github.repository }}/actions/runs/$run_id")
            conclusion=$(jq -r '.conclusion // ""' <<<"$data")
            run_url=$(jq -r '.html_url' <<<"$data")
            pipeline=$(jq -r '.name' <<<"$data")
            head_sha=$(jq -r '.head_sha' <<<"$data")
            head_branch=$(jq -r '.head_branch' <<<"$data")
          else
            conclusion="$EVENT_CONCLUSION"
            run_url="$EVENT_RUN_URL"
            pipeline="$EVENT_PIPELINE"
            head_sha="$EVENT_HEAD_SHA"
            head_branch="$EVENT_HEAD_BRANCH"
          fi

          should_run=false
          needs_human=false
          if [[ "$EVENT_NAME" == "workflow_dispatch" && ( "$REVIEWER_SMOKE" == "true" || "$VISION_SMOKE" == "true" ) ]]; then
            should_run=true
          elif [[ "$conclusion" == "failure" ]]; then
            if [[ "$EVENT_NAME" == "workflow_dispatch" || "$head_branch" == "master" || "$head_branch" == "main" ]]; then
              should_run=true
            else
              needs_human=true
            fi
          fi
          {
            echo "should_run=$should_run"
            echo "needs_human=$needs_human"
            echo "run_id=$run_id"
            echo "run_url=$run_url"
            echo "pipeline=$pipeline"
            echo "head_sha=$head_sha"
            echo "head_branch=$head_branch"
          } >> "$GITHUB_OUTPUT"

  human-review-nondefault:
    needs: gate
    if: needs.gate.outputs.needs_human == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Route untrusted branch failure to Human Review
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          HUMAN_REVIEW_CHANNEL_ID: ${{ secrets.HUMAN_REVIEW_CHANNEL_ID }}
          PIPELINE: ${{ needs.gate.outputs.pipeline }}
          RUN_URL: ${{ needs.gate.outputs.run_url }}
          HEAD_BRANCH: ${{ needs.gate.outputs.head_branch }}
        shell: bash
        run: |
          payload=$(jq -n \
            --arg channel "$HUMAN_REVIEW_CHANNEL_ID" \
            --arg text ":octagonal_sign: *Human review required — $PIPELINE*\nFailure came from untrusted branch \`$HEAD_BRANCH\`. Agent code and artifacts were not executed.\n$RUN_URL" \
            '{channel: $channel, text: $text}')
          response=$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
            -H "Content-Type: application/json; charset=utf-8" \
            --data "$payload" https://slack.com/api/chat.postMessage)
          jq -e '.ok == true' <<<"$response" >/dev/null

  auto-fix:
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    runs-on: [self-hosted, Linux, X64, bosgame]
    timeout-minutes: 60

    steps:
      - name: Checkout trusted agent control code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || github.event.repository.default_branch }}
          path: agent-control

      - name: Checkout failed commit
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.gate.outputs.head_sha }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          path: target

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Set up k6
        uses: grafana/setup-k6-action@v1

      # No pip install needed — auto_fix_agent.py + llm_client.py use
      # only Python stdlib (urllib.request). All rotation logic is local.

      - name: Configure git
        working-directory: target
        run: |
          git config user.email "qa-apps@users.noreply.github.com"
          git config user.name "qa-apps agent-fix"

      - name: Download test artifacts from failed run
        uses: actions/github-script@v8
        env:
          FAILED_RUN_ID: ${{ needs.gate.outputs.run_id }}
        with:
          script: |
            const runId = Number(process.env.FAILED_RUN_ID);
            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId,
            });
            const fs = require('fs');
            const path = require('path');
            const destination = path.join(process.env.GITHUB_WORKSPACE, 'target');
            for (const artifact of artifacts.data.artifacts) {
              const names = [
                'test-results', 'playwright-report', 'eval-results',
                'eval-report', 'k6-performance-results', 'promptfoo-results',
                'vision-audit-results',
              ];
              if (names.some(n => artifact.name.includes(n))) {
                const zip = await github.rest.actions.downloadArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id,
                  archive_format: 'zip',
                });
                fs.writeFileSync(
                  path.join(destination, `${artifact.name}.zip`),
                  Buffer.from(zip.data),
                );
                console.log(`Downloaded: ${artifact.name}.zip`);
              }
            }

      - name: Extract artifacts
        working-directory: target
        shell: bash
        run: |
          shopt -s nullglob
          for f in *.zip; do
            unzip -o "$f" -d "${f%.zip}/"
          done

      - name: Wait for and warm local model
        env:
          OLLAMA_BASE_URL: http://127.0.0.1:11434
          LOCAL_LLM_MODEL: ${{ inputs.vision_smoke && 'qwen3-vl-30b-a3b-screen:latest' || 'gpt-oss:120b' }}
        shell: bash
        run: |
          for attempt in {1..20}; do
            if curl --fail --silent --max-time 10 "$OLLAMA_BASE_URL/v1/models" | \
              python3 -c 'import json,sys; wanted=sys.argv[1]; data=json.load(sys.stdin); raise SystemExit(0 if any(m.get("id") == wanted for m in data.get("data", [])) else 1)' "$LOCAL_LLM_MODEL"; then
              break
            fi
            if [[ "$attempt" == "20" ]]; then
              echo "Local GPT-OSS was not available after 5 minutes."
              exit 1
            fi
            sleep 15
          done
          curl --silent --max-time 180 "$OLLAMA_BASE_URL/api/generate" \
            -d "{\"model\":\"$LOCAL_LLM_MODEL\",\"prompt\":\"ok\",\"stream\":false,\"keep_alive\":-1,\"options\":{\"num_predict\":1}}" \
            >/dev/null

      - name: Install Vision audit dependencies
        if: inputs.vision_smoke == true
        working-directory: agent-control
        run: |
          npm ci --no-audit --no-fund --ignore-scripts
          npx playwright install chromium

      - name: Run Vision audit smoke
        if: inputs.vision_smoke == true
        id: vision_smoke
        continue-on-error: true
        working-directory: agent-control
        env:
          BASE_URL: https://www.alexpavsky.com
          OLLAMA_BASE_URL: http://127.0.0.1:11434
          VISION_MODEL: qwen3-vl-30b-a3b-screen:latest
          VISION_AUDIT_MAX_STEPS: '4'
          VISION_AUDIT_OUTPUT_DIR: vision-audit
        run: node .github/scripts/vision_audit_agent.mjs

      - name: Publish Vision smoke to Slack
        if: always() && inputs.vision_smoke == true
        working-directory: agent-control
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 .github/scripts/notify_vision_slack.py \
            --report vision-audit/vision-audit-report.json \
            --channel "${{ secrets.SLACK_UI_CODEX_CHANNEL_ID }}"

      - name: Upload Vision smoke evidence
        if: always() && inputs.vision_smoke == true
        uses: actions/upload-artifact@v5
        with:
          name: vision-audit-smoke
          path: agent-control/vision-audit/
          retention-days: 30
          if-no-files-found: warn

      - name: Run auto-fix agent
        if: inputs.vision_smoke != true
        working-directory: target
        env:
          GITHUB_TOKEN:           ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN:               ${{ secrets.GITHUB_TOKEN }}
          REPO:                   ${{ github.repository }}
          FAILED_RUN_ID:          ${{ needs.gate.outputs.run_id }}
          FAILED_RUN_URL:         ${{ needs.gate.outputs.run_url }}
          PIPELINE:               ${{ needs.gate.outputs.pipeline }}
          HEAD_SHA:               ${{ needs.gate.outputs.head_sha }}
          HEAD_BRANCH:            ${{ needs.gate.outputs.head_branch }}
          DEFAULT_BRANCH:         ${{ github.event.repository.default_branch }}
          AUTO_MERGE:             ${{ github.event_name != 'workflow_dispatch' || inputs.auto_merge }}
          REVIEWER_SMOKE:         ${{ inputs.reviewer_smoke || false }}
          LOCAL_LLM_API_KEY:      ollama
          LOCAL_LLM_BASE_URL:     http://127.0.0.1:11434/v1
          LOCAL_LLM_MODEL:        gpt-oss:120b
          LOCAL_LLM_REASONING_EFFORT: low
          LOCAL_LLM_TIMEOUT_SEC:  '180'
          FINAL_SMART_MODEL:      gpt-5.1
          FINAL_CHEAP_MODEL:      deepseek/deepseek-v4.1-flash
          OPENAI_API_KEY:         ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY:     ${{ secrets.OPENROUTER_API_KEY }}
          SLACK_BOT_TOKEN:        ${{ secrets.SLACK_BOT_TOKEN }}
          PR_REVIEW_CHANNEL_ID:   ${{ secrets.PR_REVIEW_CHANNEL_ID }}
          BUG_REPORTS_CHANNEL_ID: ${{ secrets.BUG_REPORTS_CHANNEL_ID }}
          AGENT_REPORTS_CHANNEL_ID: ${{ secrets.AGENT_REPORTS_CHANNEL_ID }}
          HUMAN_REVIEW_CHANNEL_ID: ${{ secrets.HUMAN_REVIEW_CHANNEL_ID }}
        run: python3 ../agent-control/.github/scripts/auto_fix_agent.py

      - name: Fail when Vision smoke confirmed a defect
        if: inputs.vision_smoke == true && steps.vision_smoke.outcome == 'failure'
        run: exit 1

      - name: Upload agent decision trail
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: agent-fix-report-${{ needs.gate.outputs.run_id }}
          path: target/agent-fix-report.json
          retention-days: 30
          if-no-files-found: warn
