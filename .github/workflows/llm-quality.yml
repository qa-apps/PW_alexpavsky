name: LLM Quality (LLM Judge tests)

# Companion to playwright-ci.yml. The "LLM Judge" suite lives here because
# every test exercises production /api/chat and grades only essential behavior
# with the local GPT-OSS judge on bosgame. Style and tone are not quality gates.
#
# This workflow runs the same tests as main in isolation. The test step is
# temporarily non-blocking so reports and Slack notifications are always
# produced; a final step restores the correct failed job status.

on:
  workflow_dispatch:
  schedule:
    # Check hourly. The daily marker below runs the suite once per New York day;
    # queued runs resume automatically when the bosgame runner comes online.
    - cron: '30 * * * *'

concurrency:
  group: llm-quality-${{ github.ref }}
  cancel-in-progress: false

permissions: read-all

jobs:
  llm-quality:
    runs-on: [self-hosted, Linux, X64, bosgame]
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
      options: --add-host host.docker.internal:host-gateway --user 1001:1001
    timeout-minutes: 480
    env:
      LLM_CATALOG_URL: http://host.docker.internal:11434
      OLLAMA_BASE_URL: ${{ github.event_name == 'schedule' && 'http://host.docker.internal:11445' || 'http://host.docker.internal:11434' }}
      LOCAL_LLM_BASE_URL: ${{ github.event_name == 'schedule' && 'http://host.docker.internal:11445/v1' || 'http://host.docker.internal:11434/v1' }}
      LOCAL_LLM_MODEL: ${{ github.event_name == 'schedule' && 'scheduled/gpt-oss:120b' || 'gpt-oss:120b' }}
      LOCAL_LLM_UPSTREAM_MODEL: gpt-oss:120b
      LOCAL_LLM_PRIORITY_MAX_WAIT_SEC: ${{ github.event_name == 'schedule' && '21600' || '0' }}
      LOCAL_EMBEDDING_MODEL: qwen3-embedding:4b
      LOCAL_LLM_API_KEY: ollama
      LOCAL_LLM_TIMEOUT_SEC: '180'
      LOCAL_LLM_TIMEOUT_MS: '180000'
      LOCAL_LLM_MAX_TOKENS: '1024'
      LOCAL_LLM_REASONING_EFFORT: low
      LLM_TEST_TIMEOUT_MS: '300000'
      LLM_JUDGE_PASSING_SCORE: '3'
      NPM_CONFIG_CACHE: /tmp/npm-cache
      npm_config_devdir: /tmp/node-gyp

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Resolve daily evaluation date
        id: eval_day
        shell: bash
        run: |
          now_minutes=$((10#$(TZ=America/New_York date +%H) * 60 + 10#$(TZ=America/New_York date +%M)))
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$now_minutes" -lt 870 ]; then
            eval_day=$(TZ=America/New_York date -d yesterday +%F)
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            eval_day=$(TZ=America/New_York date +%F)
          else
            eval_day="manual-${{ github.run_id }}"
          fi
          echo "date=$eval_day" >> "$GITHUB_OUTPUT"

      - name: Restore daily completion marker
        id: daily_marker
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .ci-markers/llm-quality.done
          key: bosgame-llm-quality-${{ steps.eval_day.outputs.date }}

      - name: Check local GPT-OSS availability
        id: local_llm
        if: steps.daily_marker.outputs.cache-hit != 'true'
        shell: bash
        run: |
          if models=$(curl --connect-timeout 5 --max-time 15 --fail --silent --show-error "$LLM_CATALOG_URL/v1/models") && \
             python3 -c 'import json,sys; wanted=sys.argv[1]; data=json.load(sys.stdin); raise SystemExit(0 if any(m.get("id") == wanted for m in data.get("data", [])) else 1)' "$LOCAL_LLM_UPSTREAM_MODEL" <<<"$models"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Local model $LOCAL_LLM_MODEL is ready."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Local model unavailable; the next hourly schedule will retry."
          fi

      - name: Nightly Bosgame — report unavailable
        if: steps.daily_marker.outputs.cache-hit != 'true' && steps.local_llm.outputs.run != 'true'
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: |
          python3 .github/scripts/notify_bosgame_run_slack.py \
            --channel "${{ secrets.SLACK_NIGHTLY_BOSGAME_CHANNEL_ID }}" \
            --suite "LLM Quality" --event down

      - name: Nightly Bosgame — report available
        if: steps.local_llm.outputs.run == 'true'
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: |
          python3 .github/scripts/notify_bosgame_run_slack.py \
            --channel "${{ secrets.SLACK_NIGHTLY_BOSGAME_CHANNEL_ID }}" \
            --suite "LLM Quality" --event up

      - name: Warm up local model (up to 2 min)
        if: steps.local_llm.outputs.run == 'true'
        shell: bash
        run: |
          echo "Warming $LOCAL_LLM_UPSTREAM_MODEL (scheduled work waits behind interactive use)…"
          curl -s --max-time 150 "$OLLAMA_BASE_URL/api/generate" \
            -H "X-LLM-Job-ID: $GITHUB_RUN_ID" -H "X-LLM-Model: $LOCAL_LLM_UPSTREAM_MODEL" \
            -d "{\"model\":\"$LOCAL_LLM_UPSTREAM_MODEL\",\"prompt\":\"ok\",\"stream\":false,\"keep_alive\":-1,\"options\":{\"num_predict\":1}}" \
            >/dev/null || echo "warm-up request timed out (continuing anyway)"
          if [ -n "${LOCAL_EMBEDDING_MODEL:-}" ]; then
            curl -s --max-time 60 "$OLLAMA_BASE_URL/api/embed" \
              -H "X-LLM-Job-ID: $GITHUB_RUN_ID" -H "X-LLM-Model: $LOCAL_EMBEDDING_MODEL" \
              -d "{\"model\":\"$LOCAL_EMBEDDING_MODEL\",\"input\":\"ok\",\"keep_alive\":-1}" >/dev/null || true
          fi

      - name: Checkout existing gh-pages site (if any)
        if: steps.local_llm.outputs.run == 'true'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: gh-pages
          path: gh-pages-existing
        continue-on-error: true

      - name: Set up Node.js
        if: steps.local_llm.outputs.run == 'true'
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22

      - name: Install dependencies
        if: steps.local_llm.outputs.run == 'true'
        env:
          HOME: /tmp/node-home
        run: |
          mkdir -p "$HOME" "$NPM_CONFIG_CACHE" "$npm_config_devdir"
          npm ci --ignore-scripts

      - name: Install Playwright browsers
        if: steps.local_llm.outputs.run == 'true'
        run: npx playwright install chromium

      - name: Run LLM Judge tests
        if: steps.local_llm.outputs.run == 'true'
        # Keep later report, artifact, and Slack steps running on failures.
        continue-on-error: true
        id: run_tests
        # "LLM Judge" = the dedicated judge suite; "Content quality" = the
        # @upstream article-quality-judge specs, migrated here so their judge
        # runs on local gpt-oss instead of free-tier providers.
        run: npx playwright test --grep "LLM Judge|Content quality" --workers=1 --reporter=list,json
        env:
          CI: true
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/results.json

      - name: Upload Playwright report
        if: always() && steps.local_llm.outputs.run == 'true'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: llm-quality-report-${{ github.run_number }}
          path: playwright-report/
          retention-days: 30

      - name: Upload judge verdicts
        if: always() && steps.local_llm.outputs.run == 'true'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: judge-verdicts-${{ github.run_number }}
          path: |
            test-results/
            judge-verdicts/
          retention-days: 30
          if-no-files-found: ignore

      - name: Post summary to job
        if: always() && steps.local_llm.outputs.run == 'true'
        run: |
          echo "## LLM Quality Run #${{ github.run_number }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Tests in this workflow probe the production AI chatbot via" >> "$GITHUB_STEP_SUMMARY"
          echo "the production chatbot and grade essential behavior with local GPT-OSS." >> "$GITHUB_STEP_SUMMARY"
          echo "Style and tone are intentionally outside this smoke gate." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Step status:** ${{ steps.run_tests.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Artifacts:" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`llm-quality-report-${{ github.run_number }}\` — full Playwright HTML report" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`judge-verdicts-${{ github.run_number }}\` — per-prompt judge scores + reasoning" >> "$GITHUB_STEP_SUMMARY"

      - name: Build LLM Judge Pages UI
        id: build_ui
        if: always() && steps.local_llm.outputs.run == 'true'
        env:
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ID: ${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
          REPO_SLUG: ${{ github.repository }}
        run: python3 scripts/build_llm_judge_site.py

      - name: Upload Pages site for isolated publisher
        id: upload_pages
        if: always() && steps.local_llm.outputs.run == 'true'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: llm-quality-pages-${{ github.run_id }}
          path: gh-pages-site/
          retention-days: 1
          if-no-files-found: error

      - name: Notify Slack
        if: always() && steps.local_llm.outputs.run == 'true'
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          OWNER_LC=$(echo "$REPO_OWNER" | tr '[:upper:]' '[:lower:]')
          LLM_JUDGE_DASHBOARD_URL="https://${OWNER_LC}.github.io/${REPO_NAME}/llm-judge/runs/${{ github.run_number }}/"
          python3 .github/scripts/notify_slack.py \
            --channel "${{ secrets.SLACK_LLM_QUALITY_CHANNEL_ID }}" \
            --pipeline "LLM Quality" \
            --results-dir test-results \
            --dashboard-url "$LLM_JUDGE_DASHBOARD_URL" \
            --dashboard-label "Open LLM Judge UI"


      - name: Post bug report to Slack
        if: steps.local_llm.outputs.run == 'true' && steps.run_tests.outcome == 'failure'
        env:
          SLACK_BOT_TOKEN:    ${{ secrets.SLACK_BOT_TOKEN }}
          GITHUB_RUN_URL:     ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GITHUB_REPOSITORY:  ${{ github.repository }}
          GITHUB_SHA:         ${{ github.sha }}
          GITHUB_REF:         ${{ github.ref }}
          PR_NUMBER:          ${{ github.event.pull_request.number }}
          PR_TITLE:           ${{ github.event.pull_request.title }}
        run: |
          python3 .github/scripts/bug_report_slack.py \
            --channel "${{ secrets.BUG_REPORTS_CHANNEL_ID }}" \
            --pipeline "LLM Quality" \
            --results-dir test-results

      - name: Nightly Bosgame — post results
        if: always() && steps.local_llm.outputs.run == 'true'
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 .github/scripts/notify_bosgame_run_slack.py \
            --channel "${{ secrets.SLACK_NIGHTLY_BOSGAME_CHANNEL_ID }}" \
            --suite "LLM Quality" --event result \
            --format playwright --results test-results/results.json

      - name: Save daily completion marker
        if: always() && steps.local_llm.outputs.run == 'true' && github.event_name == 'schedule'
        shell: bash
        run: |
          mkdir -p .ci-markers
          date -u +%FT%TZ > .ci-markers/llm-quality.done

      - name: Cache daily completion marker
        if: always() && steps.local_llm.outputs.run == 'true' && github.event_name == 'schedule'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .ci-markers/llm-quality.done
          key: bosgame-llm-quality-${{ steps.eval_day.outputs.date }}

      - name: Fail if LLM quality tests failed
        if: steps.local_llm.outputs.run == 'true' && steps.run_tests.outcome == 'failure'
        run: exit 1

      - name: Release background model lease
        if: always() && github.event_name == 'schedule'
        run: |
          curl -fsS -X POST \
            -H "X-LLM-Job-ID: $GITHUB_RUN_ID" \
            http://127.0.0.1:11443/release/background || true

  publish-llm-quality-pages:
    name: Publish Pages from GitHub-hosted runner
    if: always()
    needs: llm-quality
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download generated Pages site
        id: download_pages
        continue-on-error: true
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: llm-quality-pages-${{ github.run_id }}
          path: gh-pages-site

      - name: Publish Pages site
        if: steps.download_pages.outcome == 'success'
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./gh-pages-site
          force_orphan: false
          keep_files: true
          enable_jekyll: false
          commit_message: "llm judge site: run #${{ github.run_number }}"
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
