name: Weekly QA Report

on:
  schedule:
    # Sunday 06:50 America/New_York, after the daily RAG evaluation.
    - cron: '50 10 * * 0'
    - cron: '50 11 * * 0'
  workflow_dispatch:        # Run manually from GitHub Actions UI

concurrency:
  group: weekly-qa-report
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  schedule-gate:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
    steps:
      - name: Evaluate scheduled run window
        id: gate
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" != "schedule" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ny_tz="$(TZ=America/New_York date +%Z)"
          case "${{ github.event.schedule }}|$ny_tz" in
            "50 10 * * 0|EDT"|"50 11 * * 0|EST") should_run=true ;;
            *) should_run=false ;;
          esac
          echo "should_run=$should_run" >> "$GITHUB_OUTPUT"

  generate-report:
    needs: schedule-gate
    if: needs.schedule-gate.outputs.should_run == 'true'
    runs-on: [self-hosted, Linux, X64, bosgame]
    timeout-minutes: 390

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      # Download latest Playwright artifact that actually exists. The workflow
      # has schedule-gate-only success runs with no artifacts, so picking the
      # newest successful run blindly creates a green "0 tests" report.
      - name: Download latest Playwright test results
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p test-results
          found=0

          for run_id in $(gh run list \
            --workflow playwright-ci.yml \
            --branch master \
            --status success \
            --limit 50 \
            --json databaseId \
            --jq '.[].databaseId'); do
            echo "Checking Playwright run ${run_id} for test-results artifact"
            if gh run download "$run_id" -n test-results -D test-results 2>/dev/null; then
              if find test-results -name 'results-pure.json' -print -quit | grep -q .; then
                echo "Downloaded test-results from Playwright run ${run_id}"
                found=1
                break
              fi
              find test-results -mindepth 1 -maxdepth 1 -exec rm -rf {} +
            fi
          done

          if [[ "$found" != "1" ]]; then
            echo "::error::No Playwright test-results artifact with results-pure.json found"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install httpx python-dateutil

      - name: Wait for local GPT-OSS
        env:
          LOCAL_LLM_API_KEY: ${{ secrets.LOCAL_LLM_API_KEY }}
        run: |
          : "${LOCAL_LLM_API_KEY:?LOCAL_LLM_API_KEY secret is required}"
          deadline=$((SECONDS + 21600))
          until curl --connect-timeout 5 --max-time 15 --fail --silent --show-error \
            -H "Authorization: Bearer $LOCAL_LLM_API_KEY" \
            -H "X-LLM-Job-ID: $GITHUB_RUN_ID" \
            -H "X-LLM-Model: gpt-oss:120b" \
            http://127.0.0.1:11445/v1/models >/dev/null; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "Local GPT-OSS did not become available within six hours"
              exit 1
            fi
            sleep 10
          done

      - name: Generate weekly report and send to Slack + site
        env:
          LOCAL_LLM_BASE_URL:  http://127.0.0.1:11445/v1
          LOCAL_LLM_API_KEY:   ${{ secrets.LOCAL_LLM_API_KEY }}
          LOCAL_LLM_MODEL:     scheduled/gpt-oss:120b
          LOCAL_LLM_JOB_ID:    ${{ github.run_id }}
          SLACK_WEBHOOK_URL:   ${{ secrets.SLACK_WEBHOOK_URL }}
          SITE_REPORTS_URL:    https://alexpavsky.com/api/agent-reports
          MAINTENANCE_KEY:     ${{ secrets.MAINTENANCE_KEY }}
          GITHUB_RUN_URL:      ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python .github/scripts/weekly_report.py

      - name: Release background model lease
        if: always()
        env:
          LOCAL_LLM_API_KEY: ${{ secrets.LOCAL_LLM_API_KEY }}
        run: |
          curl --connect-timeout 5 --max-time 15 --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $LOCAL_LLM_API_KEY" \
            -H "X-LLM-Job-ID: $GITHUB_RUN_ID" \
            http://127.0.0.1:11443/release/background >/dev/null || true

      - name: Upload report as artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: weekly-report-${{ github.run_id }}
          path: judge-verdicts/weekly-report-*.md
          retention-days: 90
          if-no-files-found: ignore

      - name: Notify Slack
        if: always()
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          python .github/scripts/notify_slack.py \
            --channel "${{ secrets.SLACK_WEEKLY_REPORT_CHANNEL_ID }}" \
            --pipeline "Weekly QA Report" \
            --results-dir test-results \
            --results-pattern "**/results-pure.json"
