name: LLM Eval Nightly (Ragas + Giskard)

on:
  # Manual trigger from Actions UI
  workflow_dispatch:
    inputs:
      max_questions:
        description: 'Limit Ragas golden questions (0 = all)'
        required: false
        default: '15'
      rag_api_url:
        description: 'RAG API URL'
        required: false
        default: 'https://alexpavsky.com'
      giskard_num_questions:
        description: 'Giskard RAG questions for manual light runs'
        required: false
        default: '1'
      run_giskard_scan:
        description: 'Run the full Giskard vulnerability scan'
        required: false
        type: boolean
        default: false

  # Check hourly; run once per New York day when bosgame is available.
  schedule:
    - cron: '45 * * * *'

concurrency:
  group: ragas-nightly-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  evaluate:
    runs-on: [self-hosted, Linux, X64, bosgame]
    timeout-minutes: 300
    env:
      OLLAMA_BASE_URL: http://127.0.0.1:11434
      LOCAL_LLM_BASE_URL: http://127.0.0.1:11434/v1
      LOCAL_LLM_MODEL: gpt-oss:120b
      LOCAL_EMBEDDING_MODEL: qwen3-embedding:4b
      LOCAL_LLM_API_KEY: ollama
      LOCAL_LLM_TIMEOUT_SEC: '180'
      LOCAL_LLM_TIMEOUT_MS: '180000'

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve daily evaluation date
        id: eval_day
        shell: bash
        run: |
          now_minutes=$((10#$(TZ=America/New_York date +%H) * 60 + 10#$(TZ=America/New_York date +%M)))
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$now_minutes" -lt 825 ]; then
            eval_day=$(TZ=America/New_York date -d yesterday +%F)
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            eval_day=$(TZ=America/New_York date +%F)
          else
            eval_day="manual-${{ github.run_id }}"
          fi
          echo "date=$eval_day" >> "$GITHUB_OUTPUT"

      - name: Restore daily completion marker
        id: daily_marker
        uses: actions/cache/restore@v4
        with:
          path: .ci-markers/ragas-giskard.done
          key: bosgame-ragas-giskard-${{ steps.eval_day.outputs.date }}

      - name: Check local models
        id: local_llm
        if: steps.daily_marker.outputs.cache-hit != 'true'
        shell: bash
        run: |
          if models=$(curl --connect-timeout 5 --max-time 15 --fail --silent --show-error "$OLLAMA_BASE_URL/v1/models") && \
             python3 -c 'import json,sys; wanted=set(sys.argv[1:]); data=json.load(sys.stdin); found={m.get("id") for m in data.get("data", [])}; raise SystemExit(0 if wanted <= found else 1)' "$LOCAL_LLM_MODEL" "$LOCAL_EMBEDDING_MODEL" <<<"$models"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Local judge or embedding model unavailable; the next hourly schedule will retry."
          fi

      - name: Nightly Bosgame — report unavailable
        if: steps.daily_marker.outputs.cache-hit != 'true' && steps.local_llm.outputs.run != 'true'
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: |
          python3 .github/scripts/notify_bosgame_run_slack.py \
            --channel "${{ secrets.SLACK_NIGHTLY_BOSGAME_CHANNEL_ID }}" \
            --suite "Ragas + Giskard" --event down

      - name: Nightly Bosgame — report available
        if: steps.local_llm.outputs.run == 'true'
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: |
          python3 .github/scripts/notify_bosgame_run_slack.py \
            --channel "${{ secrets.SLACK_NIGHTLY_BOSGAME_CHANNEL_ID }}" \
            --suite "Ragas + Giskard" --event up

      - name: Warm up local models (up to 2 min)
        if: steps.local_llm.outputs.run == 'true'
        shell: bash
        run: |
          echo "Warming $LOCAL_LLM_MODEL + $LOCAL_EMBEDDING_MODEL (budget 150s)…"
          curl -s --max-time 150 "$OLLAMA_BASE_URL/api/generate" \
            -d "{\"model\":\"$LOCAL_LLM_MODEL\",\"prompt\":\"ok\",\"stream\":false,\"keep_alive\":-1,\"options\":{\"num_predict\":1}}" \
            >/dev/null || echo "warm-up request timed out (continuing anyway)"
          if [ -n "${LOCAL_EMBEDDING_MODEL:-}" ]; then
            curl -s --max-time 60 "$OLLAMA_BASE_URL/api/embed" \
              -d "{\"model\":\"$LOCAL_EMBEDDING_MODEL\",\"input\":\"ok\",\"keep_alive\":-1}" >/dev/null || true
          fi

      - name: Checkout existing gh-pages site (if any)
        if: steps.local_llm.outputs.run == 'true'
        uses: actions/checkout@v5
        with:
          ref: gh-pages
          path: gh-pages-existing
        continue-on-error: true

      - name: Set up Python 3.11
        if: steps.local_llm.outputs.run == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'eval/requirements.txt'

      - name: Install Ragas + LangChain
        if: steps.local_llm.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r eval/requirements.txt

      - name: Pre-download sentence-transformers model
        if: steps.local_llm.outputs.run == 'true'
        run: |
          python -c "from sentence_transformers import SentenceTransformer; SentenceTransformer('all-MiniLM-L6-v2')"

      - name: Run Ragas evaluation
        if: steps.local_llm.outputs.run == 'true'
        env:
          # GPT-OSS 120B judge and local embeddings are supplied by bosgame.
          # RAG API endpoint (production)
          RAG_API_URL: ${{ inputs.rag_api_url || 'https://alexpavsky.com' }}
          # Quality gates
          MAX_QUESTIONS: ${{ inputs.max_questions || '15' }}
          MIN_FAITHFULNESS: '0.65'
          MIN_RELEVANCY: '0.55'
          REQUEST_DELAY_SEC: '2.0'
        run: |
          python eval/ragas_eval.py

      - name: Run Giskard RAG eval (auto-generated questions)
        if: always() && steps.local_llm.outputs.run == 'true'
        working-directory: eval
        env:
          RAG_API_URL: ${{ inputs.rag_api_url || 'https://alexpavsky.com' }}
          GISKARD_NUM_QUESTIONS: ${{ inputs.giskard_num_questions || '3' }}
        run: |
          python giskard_rag.py

      - name: Run Giskard vulnerability scan (7 categories)
        if: ${{ always() && steps.local_llm.outputs.run == 'true' && (github.event_name == 'schedule' || inputs.run_giskard_scan == true || inputs.run_giskard_scan == 'true') }}
        working-directory: eval
        env:
          RAG_API_URL: ${{ inputs.rag_api_url || 'https://alexpavsky.com' }}
        run: |
          python giskard_scan.py || echo "Giskard scan finished with non-zero exit"

      - name: Upload eval reports
        if: always() && steps.local_llm.outputs.run == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: eval-reports-${{ github.run_number }}
          path: |
            eval/results/report.md
            eval/results/giskard_rag.html
            eval/results/giskard_rag.json
            eval/results/giskard_scan.html
            eval/results/giskard_scan.json
          retention-days: 30
          if-no-files-found: warn

      - name: Build GitHub Pages site
        if: always() && steps.local_llm.outputs.run == 'true'
        env:
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ID: ${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
          REPO_SLUG: ${{ github.repository }}
        run: |
          python scripts/build_eval_site.py

      - name: Publish to gh-pages
        if: always() && steps.local_llm.outputs.run == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./gh-pages-site
          force_orphan: false
          keep_files: true
          enable_jekyll: false
          commit_message: "eval site: run #${{ github.run_number }}"
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"

      - name: Post summary to job
        if: always() && steps.local_llm.outputs.run == 'true'
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          OWNER_LC=$(echo "$REPO_OWNER" | tr '[:upper:]' '[:lower:]')
          PAGES_URL="https://${OWNER_LC}.github.io/${REPO_NAME}"
          echo "## 📊 Live dashboard" >> "$GITHUB_STEP_SUMMARY"
          echo "- All runs: ${PAGES_URL}/" >> "$GITHUB_STEP_SUMMARY"
          echo "- This run: ${PAGES_URL}/runs/${{ github.run_number }}/" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f eval/results/report.md ]; then
            echo "## Ragas Evaluation Summary" >> "$GITHUB_STEP_SUMMARY"
            head -30 eval/results/report.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f eval/results/giskard_rag.json ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "## Giskard RAG Eval" >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat eval/results/giskard_rag.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f eval/results/giskard_scan.json ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "## Giskard Vulnerability Scan" >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat eval/results/giskard_scan.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Notify Slack
        if: always() && steps.local_llm.outputs.run == 'true'
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          REPO_NAME: ${{ github.event.repository.name }}
          OWNER_LC: ${{ github.repository_owner }}
        run: |
          OWNER_LC=$(echo "$OWNER_LC" | tr '[:upper:]' '[:lower:]')
          # Read pass/fail counts written by eval/ragas_eval.py (summary.json).
          # The old grep-the-markdown approach never matched anything because
          # report.md has no "passed: N" / "failed: N" lines — that's why
          # #qa-rag-eval used to always show 0/0.
          PASSED=0; FAILED=0
          if [ -f eval/results/summary.json ]; then
            PASSED=$(python3 -c "import json; print(json.load(open('eval/results/summary.json'))['passed'])")
            FAILED=$(python3 -c "import json; print(json.load(open('eval/results/summary.json'))['failed'])")
          fi
          python .github/scripts/notify_slack.py \
            --channel "${{ secrets.SLACK_RAGAS_CHANNEL_ID }}" \
            --pipeline "RAG Eval Nightly" \
            --passed "${PASSED:-0}" \
            --failed "${FAILED:-0}" \
            --flaky 0 \
            --skipped 0 \
            --dashboard-url "https://${OWNER_LC}.github.io/${REPO_NAME}/runs/${{ github.run_number }}/#ragas" \
            --dashboard-label "Open Ragas UI"

      - name: Notify Giskard Slack
        if: always() && steps.local_llm.outputs.run == 'true'
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPO_NAME: ${{ github.event.repository.name }}
          OWNER_LC: ${{ github.repository_owner }}
        run: |
          OWNER_LC=$(echo "$OWNER_LC" | tr '[:upper:]' '[:lower:]')
          # Giskard RAG correctness + 7-category vuln scan -> its own channel,
          # separate from the Ragas faithfulness/relevancy summary above.
          python .github/scripts/notify_giskard_slack.py \
            --channel "${{ secrets.SLACK_GISKARD_CHANNEL_ID }}" \
            --results-dir eval/results \
            --run-url "$GITHUB_RUN_URL" \
            --dashboard-url "https://${OWNER_LC}.github.io/${REPO_NAME}/runs/${{ github.run_number }}/#giskard-rag"

      - name: Send failure email (severity-tagged)
        if: failure() && steps.local_llm.outputs.run == 'true'
        env:
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_SERVER: ${{ secrets.MAIL_SERVER }}
          MAIL_PORT: ${{ secrets.MAIL_PORT }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python .github/scripts/notify_email.py \
            --severity major \
            --pipeline "LLM Eval Nightly (Ragas + Giskard)" \
            --status failure \
            --run-url "$RUN_URL"

      - name: Post bug report to Slack
        if: failure() && steps.local_llm.outputs.run == 'true'
        env:
          SLACK_BOT_TOKEN:    ${{ secrets.SLACK_BOT_TOKEN }}
          GITHUB_RUN_URL:     ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GITHUB_REPOSITORY:  ${{ github.repository }}
          GITHUB_SHA:         ${{ github.sha }}
          GITHUB_REF:         ${{ github.ref }}
          PR_NUMBER:          ${{ github.event.pull_request.number }}
          PR_TITLE:           ${{ github.event.pull_request.title }}
          # Full LLM rotation — see llm_client.py for the provider list.
        run: |
          python .github/scripts/bug_report_slack.py \
            --channel "${{ secrets.BUG_REPORTS_CHANNEL_ID }}" \
            --pipeline "RAG Eval Nightly" \
            --results-dir eval/results

      - name: Nightly Bosgame — post results
        if: always() && steps.local_llm.outputs.run == 'true'
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 .github/scripts/notify_bosgame_run_slack.py \
            --channel "${{ secrets.SLACK_NIGHTLY_BOSGAME_CHANNEL_ID }}" \
            --suite "Ragas + Giskard" --event result --format none

      - name: Save daily completion marker
        if: always() && steps.local_llm.outputs.run == 'true' && github.event_name == 'schedule'
        shell: bash
        run: |
          mkdir -p .ci-markers
          date -u +%FT%TZ > .ci-markers/ragas-giskard.done

      - name: Cache daily completion marker
        if: always() && steps.local_llm.outputs.run == 'true' && github.event_name == 'schedule'
        uses: actions/cache/save@v4
        with:
          path: .ci-markers/ragas-giskard.done
          key: bosgame-ragas-giskard-${{ steps.eval_day.outputs.date }}
