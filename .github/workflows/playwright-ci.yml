name: Playwright CI (deterministic tests)

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:
  schedule:
    # Daytime daily run at 1 PM America/New_York. GitHub cron is UTC,
    # so keep adjacent UTC hours and let the schedule gate handle DST.
    - cron: '0 17 * * *'
    - cron: '0 18 * * *'
    - cron: '30 20 * * 1'  # weekly Monday model registry refresh, daytime ET

concurrency:
  group: playwright-ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  schedule-gate:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}

    steps:
      - name: Evaluate scheduled run window
        id: gate
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" != "schedule" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "${{ github.event.schedule }}" == "30 20 * * 1" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ny_hour="$(TZ=America/New_York date +%H)"

          if [[ "$ny_hour" == "13" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

  playwright:
    needs: schedule-gate
    if: needs.schedule-gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Set up k6
        uses: grafana/setup-k6-action@v1

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      # ──────────────────────────────────────────────────────────────────
      # Test taxonomy (see auto-fix.agent.md for why this split exists):
      #
      #   PURE  — deterministic UI/contract tests with no external network
      #           dependency beyond alexpavsky.com itself. MUST be green;
      #           failure here = real product/test regression. Blocks merge.
      #
      #   UPSTREAM — tests that hit a free-tier LLM provider or external RSS
      #              (tagged `@upstream` in the spec). Latency and 5xx rate
      #              are outside our control. Runs with 3 retries and does
      #              not redden the pipeline — instead it posts a separate
      #              "upstream health" report to Slack.
      #
      #   LLM JUDGE — non-deterministic chatbot scoring; lives in its own
      #               workflow (llm-quality.yml). Not run here at all.
      # ──────────────────────────────────────────────────────────────────

      - name: Run Playwright tests — PURE (blocks pipeline)
        # @design specs run in their own container-based design-check.yml so the
        # pixel baselines match; excluded here to avoid cross-runner font flake
        # and to keep design (owner-decision) separate from the functional gate.
        run: npx playwright test --grep-invert "@upstream|LLM Judge|@design" --workers=1
        env:
          CI: true
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/results-pure.json
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}

      - name: Run Playwright tests — UPSTREAM (non-blocking)
        # `continue-on-error: true` means an upstream LLM rate-limit cannot
        # turn the whole CI red. The results land in a separate JSON file
        # which the upstream-health reporter (below) reads.
        if: always()
        continue-on-error: true
        env:
          CI: true
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/upstream/results.json
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: npx playwright test --grep "@upstream" --retries=3

      - name: Run k6 performance profile
        continue-on-error: true
        run: npm run performance

      - name: Run k6 load profile
        continue-on-error: true
        run: npm run performance:load

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore

      - name: Notify Slack
        if: always()
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          python .github/scripts/notify_slack.py \
            --channel "${{ secrets.SLACK_PLAYWRIGHT_CHANNEL_ID }}" \
            --pipeline "Playwright CI" \
            --results-dir test-results \
            --results-pattern "results-pure.json"

      - name: Send failure email (severity-tagged)
        if: failure()
        env:
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_SERVER: ${{ secrets.MAIL_SERVER }}
          MAIL_PORT: ${{ secrets.MAIL_PORT }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # The blocking deterministic suite is the only thing that fails this
          # job (upstream + k6 are non-blocking), so a failure here is critical.
          python .github/scripts/notify_email.py \
            --severity critical \
            --pipeline "Playwright CI (deterministic gate)" \
            --status failure \
            --run-url "$RUN_URL"


      - name: Post bug report to Slack
        if: failure()
        env:
          SLACK_BOT_TOKEN:    ${{ secrets.SLACK_BOT_TOKEN }}
          GITHUB_RUN_URL:     ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GITHUB_REPOSITORY:  ${{ github.repository }}
          GITHUB_SHA:         ${{ github.sha }}
          GITHUB_REF:         ${{ github.ref }}
          PR_NUMBER:          ${{ github.event.pull_request.number }}
          PR_TITLE:           ${{ github.event.pull_request.title }}
          # Full provider set — bug_report_slack.py uses llm_client.py which
          # rotates across all configured providers for root-cause analysis.
          GROQ_API_KEY:       ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY:   ${{ secrets.CEREBRAS_API_KEY }}
          SAMBANOVA_API_KEY:  ${{ secrets.SAMBANOVA_API_KEY }}
          MISTRAL_API_KEY:    ${{ secrets.MISTRAL_API_KEY }}
          OPENAI_API_KEY:     ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL:    ${{ secrets.OPENAI_BASE_URL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          HF_TOKEN:           ${{ secrets.HF_TOKEN }}
        run: |
          python .github/scripts/bug_report_slack.py \
            --channel "${{ secrets.BUG_REPORTS_CHANNEL_ID }}" \
            --pipeline "Playwright CI" \
            --results-dir test-results
