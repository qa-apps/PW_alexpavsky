name: Agent Observability Dashboards

on:
  workflow_dispatch:
    inputs:
      review_sha:
        description: "Optional commit SHA for an isolated cloud merge review"
        required: false
        type: string
      nanotech_sha:
        description: "Optional PW_nanotech commit SHA to include in the same review"
        required: false
        type: string
  schedule:
    # Daily: run the voice Scenario (reports to LangWatch) and the chat trace
    # check (reads back from Langfuse), then post both statuses to Slack.
    - cron: "10 20 * * *"

concurrency:
  group: agent-observability-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cloud-merge-review:
    if: github.event_name == 'workflow_dispatch' && inputs.review_sha != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout review commit
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.review_sha }}
          fetch-depth: 0

      - name: Review exact diff with the OpenCode subscription
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          REVIEW_SHA: ${{ inputs.review_sha }}
          NANOTECH_SHA: ${{ inputs.nanotech_sha }}
        run: |
          git fetch origin master --depth=1
          if [ -n "$NANOTECH_SHA" ]; then
            git clone --filter=blob:none https://github.com/qa-apps/PW_nanotech.git /tmp/PW_nanotech-review
            git -C /tmp/PW_nanotech-review fetch origin "$NANOTECH_SHA"
            git -C /tmp/PW_nanotech-review checkout --detach "$NANOTECH_SHA"
            git -C /tmp/PW_nanotech-review fetch origin main
          fi
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import sys
          import urllib.error
          import urllib.request

          alex_diff = subprocess.check_output(
              ["git", "diff", "--no-ext-diff", f"origin/master...{os.environ['REVIEW_SHA']}"],
              text=True,
          )
          nano_diff = ""
          if os.environ.get("NANOTECH_SHA"):
              nano_diff = subprocess.check_output(
                  ["git", "-C", "/tmp/PW_nanotech-review", "diff", "--no-ext-diff", f"origin/main...{os.environ['NANOTECH_SHA']}"],
                  text=True,
              )
          prompt = """Final agent-fix merge gate for two QA repositories. Review only blocking correctness or security bugs, GitHub Actions expression/step-outcome bugs, false-green daily markers, report completeness, Slack delivery, and Pages publication. All evaluation workloads must use local BossGame LLMs; OpenCode is used only by agent-fix and this final agent-fix merge gate. Quality assertion failures may publish reports, but infrastructure/report/Slack/Pages failures must withhold completion markers.

          Verified invariants in the exact commits below:
          - the isolated Pages publisher jobs use `if: always()`;
          - notify_slack.py exits non-zero when SLACK_BOT_TOKEN is absent, with a regression test;
          - Ragas/Giskard requires current-run report mtimes and non-skipped eval outcomes;
          - DeepEval sets RUN_LLM_EVALS=1 both at job level and on the pytest commands.
          - LLM Judge and DeepEval freshness checks use nanosecond timestamps; LLM Judge rejects skipped tests and stale verdict files;
          - notify_observability_slack.py returns non-zero for an unacknowledged chat.postMessage when --require-delivery is set.
          - both six-test DeepEval modules call deepeval.assert_test, so their single pytest invocation produces the required 12 testCases;
          - notify_bosgame_run_slack.py checks every chat.postMessage acknowledgement and returns 1 under --require-delivery when any post fails.
          - notify_deepeval_slack.py explicitly returns non-zero for token-backed Slack API errors under --require-delivery, with a regression test.
          Do not report one of those as absent unless the supplied diff directly contradicts it. Reply with exactly APPROVE plus at most four brief bullets, or REJECT plus blocking findings.

          PW_alexpavsky DIFF:
          """ + alex_diff + "\n\nPW_nanotech DIFF:\n" + nano_diff

          headers = {
              "Authorization": f"Bearer {os.environ['OPENCODE_API_KEY']}",
              "Content-Type": "application/json",
              "User-Agent": "PW-alexpavsky-merge-review/1.0",
          }

          def request_json(endpoint, model, payload):
              request_headers = dict(headers)
              if endpoint == "messages":
                  request_headers["anthropic-version"] = "2023-06-01"
                  request_headers["x-api-key"] = os.environ["OPENCODE_API_KEY"]
              request_headers["x-opencode-session"] = (
                  f"pw-merge-review-{os.environ.get('GITHUB_RUN_ID', 'manual')}-{model}"
              )
              request = urllib.request.Request(
                  f"https://opencode.ai/zen/go/v1/{endpoint}",
                  data=json.dumps({"model": model, **payload}).encode(),
                  headers=request_headers,
                  method="POST",
              )
              with urllib.request.urlopen(request, timeout=240) as response:
                  return json.load(response)

          def response_text(body):
              if isinstance(body.get("output_text"), str):
                  return body["output_text"].strip()
              parts = []
              for item in body.get("output", []) or []:
                  for content in item.get("content", []) or []:
                      text = content.get("text")
                      if isinstance(text, str):
                          parts.append(text)
              return "\n".join(parts).strip()

          reviewers = (
              ("gpt-5.6-luna", "responses", {
                  "input": prompt,
                  "max_output_tokens": 10000,
                  "reasoning": {"effort": "medium"},
              }),
              ("grok-4.6", "responses", {
                  "input": prompt,
                  "max_output_tokens": 6000,
              }),
          )
          approvals = []
          for model, endpoint, payload in reviewers:
              try:
                  body = request_json(endpoint, model, payload)
                  if endpoint == "responses":
                      verdict = response_text(body)
                  elif endpoint == "messages":
                      verdict = "\n".join(
                          block.get("text", "") for block in body.get("content", [])
                          if block.get("type") == "text"
                      ).strip()
                  else:
                      message = body["choices"][0]["message"]
                      verdict = (message.get("content") or message.get("reasoning") or "").strip()
                  print(f"MODEL={body.get('model', model)}")
                  print(f"USAGE={json.dumps(body.get('usage', {}), sort_keys=True)}")
                  print(verdict)
                  approvals.append(verdict.startswith("APPROVE"))
              except (urllib.error.HTTPError, urllib.error.URLError, TimeoutError, KeyError) as exc:
                  print(f"::error::{model} reviewer failed: {exc}")
                  approvals.append(False)
          if len(approvals) != len(reviewers) or not all(approvals):
              print("::error::Both independent OpenCode models must approve the exact commits")
              sys.exit(1)
          PY

  agent-checks:
    if: github.event_name != 'workflow_dispatch' || inputs.review_sha == ''
    name: Voice Scenario (LangWatch) + chat traces (Langfuse)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      voice: ${{ steps.voice.outcome }}
      langfuse: ${{ steps.langfuse.outcome }}
      langwatch_key: ${{ steps.keys.outputs.langwatch }}
      langfuse_keys: ${{ steps.keys.outputs.langfuse }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Detect backend keys
        id: keys
        env:
          LANGWATCH_API_KEY: ${{ secrets.LANGWATCH_API_KEY }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
        run: |
          echo "langwatch=$([ -n "$LANGWATCH_API_KEY" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "langfuse=$([ -n "$LANGFUSE_PUBLIC_KEY" ] && [ -n "$LANGFUSE_SECRET_KEY" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          [ -n "$LANGWATCH_API_KEY" ] || echo "::warning::LANGWATCH_API_KEY secret is missing; the voice Scenario runs but is not sent to LangWatch."
          [ -n "$LANGFUSE_PUBLIC_KEY" ] && [ -n "$LANGFUSE_SECRET_KEY" ] || echo "::warning::LANGFUSE_PUBLIC_KEY/LANGFUSE_SECRET_KEY secrets are missing; the Langfuse trace read-back is skipped."

      - name: Voice agent Scenario → LangWatch
        id: voice
        continue-on-error: true
        env:
          LANGWATCH_API_KEY: ${{ secrets.LANGWATCH_API_KEY }}
          LANGWATCH_ENDPOINT: ${{ vars.LANGWATCH_ENDPOINT || 'https://app.langwatch.ai' }}
          SCENARIO_BATCH_RUN_ID: gh-${{ github.run_id }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          # The repo's GROQ_API_KEY is rejected (Invalid API Key); OpenRouter works.
          SCENARIO_JUDGE_PROVIDER: ${{ vars.SCENARIO_JUDGE_PROVIDER || 'openrouter' }}
          SCENARIO_JUDGE_MODEL: ${{ vars.SCENARIO_JUDGE_MODEL || 'openai/gpt-oss-120b' }}
        run: npx vitest run tests/voice

      - name: Chat agent → Langfuse trace check
        id: langfuse
        continue-on-error: true
        env:
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          LANGFUSE_HOST: ${{ vars.LANGFUSE_HOST || 'https://us.cloud.langfuse.com' }}
        run: npx vitest run tests/observability

  slack-observability:
    needs: agent-checks
    if: always() && (github.event_name != 'workflow_dispatch' || inputs.review_sha == '')
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Notify Langfuse Slack channel
        if: always()
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          LANGFUSE_CHANNEL_ID: ${{ secrets.SLACK_LANGFUSE_CHANNEL_ID }}
          LANGFUSE_DASHBOARD_URL: ${{ vars.LANGFUSE_DASHBOARD_URL || secrets.LANGFUSE_DASHBOARD_URL || 'https://us.cloud.langfuse.com' }}
          ALEXPAVSKY_HEALTH_URL: ${{ vars.ALEXPAVSKY_HEALTH_URL || secrets.ALEXPAVSKY_HEALTH_URL || 'https://www.alexpavsky.com/api/health' }}
        run: |
          python .github/scripts/notify_observability_slack.py \
            --mode langfuse \
            --channel "$LANGFUSE_CHANNEL_ID" \
            --dashboard-url "$LANGFUSE_DASHBOARD_URL" \
            --health-url "$ALEXPAVSKY_HEALTH_URL" \
            --check-outcome "${{ needs.agent-checks.outputs.langfuse }}" \
            --key-configured "${{ needs.agent-checks.outputs.langfuse_keys }}"

      - name: Notify LangWatch Slack channel
        if: always()
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          LANGWATCH_CHANNEL_ID: ${{ secrets.SLACK_LANGWATCH_CHANNEL_ID }}
          LANGWATCH_DASHBOARD_URL: ${{ vars.LANGWATCH_DASHBOARD_URL || secrets.LANGWATCH_DASHBOARD_URL || 'https://app.langwatch.ai' }}
          VOICE_AGENT_HEALTH_URL: ${{ vars.VOICE_AGENT_HEALTH_URL || secrets.VOICE_AGENT_HEALTH_URL || 'https://www.alexpavsky.com/api/health' }}
        run: |
          python .github/scripts/notify_observability_slack.py \
            --mode langwatch \
            --channel "$LANGWATCH_CHANNEL_ID" \
            --dashboard-url "$LANGWATCH_DASHBOARD_URL" \
            --health-url "$VOICE_AGENT_HEALTH_URL" \
            --check-outcome "${{ needs.agent-checks.outputs.voice }}" \
            --key-configured "${{ needs.agent-checks.outputs.langwatch_key }}"
