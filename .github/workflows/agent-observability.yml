name: Agent Observability Dashboards

on:
  workflow_dispatch:
    inputs:
      review_sha:
        description: "Optional commit SHA for an isolated cloud merge review"
        required: false
        type: string
      review_repo:
        description: "Repository containing review_sha"
        required: false
        default: "qa-apps/PW_alexpavsky"
        type: string
      base_ref:
        description: "Base branch for the exact diff"
        required: false
        default: "master"
        type: string
      nanotech_sha:
        description: "Optional PW_nanotech commit SHA to include in the same review"
        required: false
        type: string
  schedule:
    # Daily: run the voice Scenario (reports to LangWatch) and the chat trace
    # check (reads back from Langfuse), then post both statuses to Slack.
    # 8:15 AM America/New_York, after the heavier overnight evals.
    - cron: "15 12 * * *"
    - cron: "15 13 * * *"

concurrency:
  group: agent-observability-${{ github.ref }}
  cancel-in-progress: false

jobs:
  schedule-gate:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
    steps:
      - name: Evaluate scheduled run window
        id: gate
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" != "schedule" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ny_tz="$(TZ=America/New_York date +%Z)"
          case "${{ github.event.schedule }}|$ny_tz" in
            "15 12 * * *|EDT"|"15 13 * * *|EST") should_run=true ;;
            *) should_run=false ;;
          esac
          echo "should_run=$should_run" >> "$GITHUB_OUTPUT"

  cloud-merge-review:
    if: github.event_name == 'workflow_dispatch' && inputs.review_sha != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout review commit
        uses: actions/checkout@v5
        with:
          repository: ${{ inputs.review_repo || github.repository }}
          ref: ${{ inputs.review_sha }}
          fetch-depth: 0

      - name: Review exact diff with the OpenCode subscription
        id: cloud_review
        continue-on-error: true
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          REVIEW_SHA: ${{ inputs.review_sha }}
          REVIEW_REPO: ${{ inputs.review_repo || github.repository }}
          BASE_REF: ${{ inputs.base_ref || 'master' }}
          NANOTECH_SHA: ${{ inputs.nanotech_sha }}
        run: |
          git fetch origin "$BASE_REF" --depth=1
          if [ -n "$NANOTECH_SHA" ]; then
            git clone --filter=blob:none https://github.com/qa-apps/PW_nanotech.git /tmp/PW_nanotech-review
            git -C /tmp/PW_nanotech-review fetch origin "$NANOTECH_SHA"
            git -C /tmp/PW_nanotech-review checkout --detach "$NANOTECH_SHA"
            git -C /tmp/PW_nanotech-review fetch origin main
          fi
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          import sys
          import urllib.error
          import urllib.request
          from pathlib import Path

          alex_diff = subprocess.check_output(
              ["git", "diff", "--no-ext-diff", f"origin/{os.environ['BASE_REF']}...{os.environ['REVIEW_SHA']}"],
              text=True,
          )
          nano_diff = ""
          if os.environ.get("NANOTECH_SHA"):
              nano_diff = subprocess.check_output(
                  ["git", "-C", "/tmp/PW_nanotech-review", "diff", "--no-ext-diff", f"origin/main...{os.environ['NANOTECH_SHA']}"],
                  text=True,
              )
          prompt = f"""Final agent-fix merge gate for {os.environ['REVIEW_REPO']}.
          Review only blocking correctness, security, deployment, or test-coverage bugs in the exact diff below. Do not suggest unrelated refactors. OpenCode is being used only for this final review, not for evaluation workloads. Reply with exactly APPROVE plus at most four brief bullets, or REJECT plus blocking findings.

          TARGET DIFF:
          """ + alex_diff + "\n\nOPTIONAL SECOND REPOSITORY DIFF:\n" + nano_diff

          headers = {
              "Authorization": f"Bearer {os.environ['OPENCODE_API_KEY']}",
              "Content-Type": "application/json",
              "User-Agent": "PW-alexpavsky-merge-review/1.0",
          }

          def request_json(endpoint, model, payload):
              request_headers = dict(headers)
              if endpoint == "messages":
                  request_headers["anthropic-version"] = "2023-06-01"
                  request_headers["x-api-key"] = os.environ["OPENCODE_API_KEY"]
              request_headers["x-opencode-session"] = (
                  f"pw-merge-review-{os.environ.get('GITHUB_RUN_ID', 'manual')}-{model}"
              )
              request = urllib.request.Request(
                  f"https://opencode.ai/zen/go/v1/{endpoint}",
                  data=json.dumps({"model": model, **payload}).encode(),
                  headers=request_headers,
                  method="POST",
              )
              with urllib.request.urlopen(request, timeout=480) as response:
                  return json.load(response)

          def response_text(body):
              if isinstance(body.get("output_text"), str):
                  return body["output_text"].strip()
              parts = []
              for item in body.get("output", []) or []:
                  for content in item.get("content", []) or []:
                      text = content.get("text")
                      if isinstance(text, str):
                          parts.append(text)
              return "\n".join(parts).strip()

          reviewer_groups = (
              (("gpt-5.6-luna", "responses", {
                  "input": prompt,
                  "max_output_tokens": 10000,
                  "reasoning": {"effort": "medium"},
              }),),
              (
                  ("mimo-v2.5", "chat/completions", {
                      "messages": [
                          {
                              "role": "system",
                              "content": "Your first token must be APPROVE or REJECT. Do not print chain-of-thought. After that token, give at most four concise findings.",
                          },
                          {"role": "user", "content": prompt},
                      ],
                      "temperature": 0.2,
                      "max_tokens": 12000,
                  }),
                  ("minimax-m3", "messages", {
                      "system": "Your first token must be APPROVE or REJECT. Do not print chain-of-thought. After that token, give at most four concise findings.",
                      "messages": [{"role": "user", "content": prompt}],
                      "max_tokens": 4000,
                  }),
                  ("longcat-2.0", "chat/completions", {
                      "messages": [
                          {
                              "role": "system",
                              "content": "Your first token must be APPROVE or REJECT. Do not print chain-of-thought. After that token, give at most four concise findings.",
                          },
                          {"role": "user", "content": prompt},
                      ],
                      "temperature": 0.2,
                      "max_tokens": 6000,
                  }),
                  ("muse-spark-1.3-contributor", "responses", {
                      "input": prompt,
                      "max_output_tokens": 6000,
                  }),
              ),
          )
          approvals = []
          report_lines = []
          for candidates in reviewer_groups:
              group_approval = None
              for model, endpoint, payload in candidates:
                  try:
                      body = request_json(endpoint, model, payload)
                      if endpoint == "responses":
                          verdict = response_text(body)
                      elif endpoint == "messages":
                          verdict = "\n".join(
                              block.get("text", "") for block in body.get("content", [])
                              if block.get("type") == "text"
                          ).strip()
                      else:
                          message = body["choices"][0]["message"]
                          verdict = (message.get("content") or message.get("reasoning") or "").strip()
                      print(f"MODEL={body.get('model', model)}")
                      print(f"USAGE={json.dumps(body.get('usage', {}), sort_keys=True)}")
                      print(verdict)
                      report_lines.extend((
                          f"MODEL={body.get('model', model)}",
                          f"USAGE={json.dumps(body.get('usage', {}), sort_keys=True)}",
                          verdict,
                          "",
                      ))
                      decisions = re.findall(r"(?m)^(APPROVE|REJECT)(?:\s|:|$)", verdict)
                      if not decisions:
                          raise ValueError("reviewer returned no explicit verdict")
                      group_approval = decisions[-1] == "APPROVE"
                      break
                  except (urllib.error.HTTPError, urllib.error.URLError, TimeoutError, KeyError, ValueError) as exc:
                      print(f"::warning::{model} reviewer unavailable: {exc}")
              approvals.append(group_approval is True)
          Path("cloud-review.txt").write_text("\n".join(report_lines), encoding="utf-8")
          if len(approvals) != len(reviewer_groups) or not all(approvals):
              print("::error::Both independent OpenCode models must approve the exact commits")
              sys.exit(1)
          PY

      - name: Route rejected cloud review to human review
        if: always() && steps.cloud_review.outcome == 'failure'
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          HUMAN_REVIEW_CHANNEL_ID: ${{ secrets.HUMAN_REVIEW_CHANNEL_ID }}
          REVIEW_REPO: ${{ inputs.review_repo || github.repository }}
          REVIEW_SHA: ${{ inputs.review_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          token = os.environ["SLACK_BOT_TOKEN"]
          channel = os.environ["HUMAN_REVIEW_CHANNEL_ID"]
          text = (
              "Human review required: one or more independent OpenCode reviewers "
              f"rejected {os.environ['REVIEW_REPO']}@{os.environ['REVIEW_SHA'][:12]}. "
              f"No merge was performed. Review details: {os.environ['RUN_URL']}"
          )
          request = urllib.request.Request(
              "https://slack.com/api/chat.postMessage",
              data=json.dumps({"channel": channel, "text": text, "unfurl_links": False}).encode(),
              headers={
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "application/json; charset=utf-8",
              },
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              body = json.load(response)
          if not body.get("ok"):
              raise SystemExit(f"Slack human-review delivery failed: {body.get('error', 'unknown_error')}")
          print("Human-review notification delivered")
          PY

      - name: Enforce two-model approval
        if: always() && steps.cloud_review.outcome != 'success'
        run: exit 1

  agent-checks:
    name: Voice Scenario (LangWatch) + chat traces (Langfuse)
    needs: schedule-gate
    if: needs.schedule-gate.outputs.should_run == 'true' && (github.event_name != 'workflow_dispatch' || inputs.review_sha == '')
    runs-on: [self-hosted, Linux, X64, bosgame]
    timeout-minutes: 30
    env:
      LOCAL_LLM_BASE_URL: ${{ github.event_name == 'schedule' && 'http://127.0.0.1:11445/v1' || 'http://127.0.0.1:11434/v1' }}
      LOCAL_LLM_MODEL: ${{ github.event_name == 'schedule' && 'scheduled/gpt-oss:120b' || 'gpt-oss:120b' }}
      LOCAL_LLM_UPSTREAM_MODEL: gpt-oss:120b
      LOCAL_LLM_API_KEY: ${{ secrets.LOCAL_LLM_API_KEY }}
    outputs:
      voice: ${{ steps.voice.outcome }}
      langfuse: ${{ steps.langfuse.outcome }}
      langwatch_key: ${{ steps.keys.outputs.langwatch }}
      langfuse_keys: ${{ steps.keys.outputs.langfuse }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Wait for local evaluator
        env:
          LOCAL_LLM_PRIORITY_MAX_WAIT_SEC: ${{ github.event_name == 'schedule' && '21600' || '900' }}
        run: |
          deadline=$((SECONDS + LOCAL_LLM_PRIORITY_MAX_WAIT_SEC))
          while true; do
            if models=$(curl --connect-timeout 5 --max-time 15 --fail --silent --show-error \
              -H "Authorization: Bearer $LOCAL_LLM_API_KEY" \
              -H "X-LLM-Job-ID: $GITHUB_RUN_ID" \
              -H "X-LLM-Model: $LOCAL_LLM_UPSTREAM_MODEL" \
              "${LOCAL_LLM_BASE_URL%/v1}/v1/models") && \
              python3 -c 'import json,sys; wanted=sys.argv[1]; ids=[m.get("id") for m in json.load(sys.stdin).get("data", [])]; raise SystemExit(0 if wanted in ids or "gpt-oss:120b" in ids else 1)' "$LOCAL_LLM_MODEL" <<<"$models"; then
              break
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "Local Scenario evaluator is unavailable."
              exit 1
            fi
            echo "Local model gateway is busy; retrying in 10s."
            sleep 10
          done

          curl --fail --silent --show-error --max-time 180 \
            -H "Authorization: Bearer $LOCAL_LLM_API_KEY" \
            -H "Content-Type: application/json" \
            -H "X-LLM-Job-ID: $GITHUB_RUN_ID" \
            -H "X-LLM-Model: $LOCAL_LLM_UPSTREAM_MODEL" \
            "$LOCAL_LLM_BASE_URL/chat/completions" \
            -d "{\"model\":\"$LOCAL_LLM_MODEL\",\"messages\":[{\"role\":\"user\",\"content\":\"Reply ready\"}],\"max_tokens\":8,\"stream\":false}" >/dev/null

      - name: Detect backend keys
        id: keys
        env:
          LANGWATCH_API_KEY: ${{ secrets.LANGWATCH_API_KEY }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
        run: |
          echo "langwatch=$([ -n "$LANGWATCH_API_KEY" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "langfuse=$([ -n "$LANGFUSE_PUBLIC_KEY" ] && [ -n "$LANGFUSE_SECRET_KEY" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          [ -n "$LANGWATCH_API_KEY" ] || echo "::warning::LANGWATCH_API_KEY secret is missing; the voice Scenario runs but is not sent to LangWatch."
          [ -n "$LANGFUSE_PUBLIC_KEY" ] && [ -n "$LANGFUSE_SECRET_KEY" ] || echo "::warning::LANGFUSE_PUBLIC_KEY/LANGFUSE_SECRET_KEY secrets are missing; the Langfuse trace read-back is skipped."

      - name: Voice agent Scenario → LangWatch
        id: voice
        continue-on-error: true
        env:
          LANGWATCH_API_KEY: ${{ secrets.LANGWATCH_API_KEY }}
          LANGWATCH_ENDPOINT: ${{ vars.LANGWATCH_ENDPOINT || 'https://app.langwatch.ai' }}
          SCENARIO_BATCH_RUN_ID: gh-${{ github.run_id }}
          SCENARIO_JUDGE_PROVIDER: local
          SCENARIO_JUDGE_MODEL: ${{ env.LOCAL_LLM_MODEL }}
        run: npx vitest run tests/voice

      - name: Chat agent → Langfuse trace check
        id: langfuse
        continue-on-error: true
        env:
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          LANGFUSE_HOST: ${{ vars.LANGFUSE_HOST || 'https://us.cloud.langfuse.com' }}
        run: npx vitest run tests/observability

      - name: Release background model lease
        if: always() && github.event_name == 'schedule'
        run: |
          curl -fsS -X POST \
            -H "X-LLM-Job-ID: $GITHUB_RUN_ID" \
            http://127.0.0.1:11443/release/background || true

  slack-observability:
    needs: agent-checks
    if: always() && needs.agent-checks.result != 'skipped' && (github.event_name != 'workflow_dispatch' || inputs.review_sha == '')
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Notify Langfuse Slack channel
        if: always()
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          LANGFUSE_CHANNEL_ID: ${{ secrets.SLACK_LANGFUSE_CHANNEL_ID }}
          LANGFUSE_DASHBOARD_URL: ${{ vars.LANGFUSE_DASHBOARD_URL || secrets.LANGFUSE_DASHBOARD_URL || 'https://us.cloud.langfuse.com' }}
          ALEXPAVSKY_HEALTH_URL: ${{ vars.ALEXPAVSKY_HEALTH_URL || secrets.ALEXPAVSKY_HEALTH_URL || 'https://www.alexpavsky.com/api/health' }}
        run: |
          python .github/scripts/notify_observability_slack.py \
            --mode langfuse \
            --channel "$LANGFUSE_CHANNEL_ID" \
            --dashboard-url "$LANGFUSE_DASHBOARD_URL" \
            --health-url "$ALEXPAVSKY_HEALTH_URL" \
            --check-outcome "${{ needs.agent-checks.outputs.langfuse }}" \
            --key-configured "${{ needs.agent-checks.outputs.langfuse_keys }}" \
            --require-delivery

      - name: Notify LangWatch Slack channel
        if: always()
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          LANGWATCH_CHANNEL_ID: ${{ secrets.SLACK_LANGWATCH_CHANNEL_ID }}
          LANGWATCH_DASHBOARD_URL: ${{ vars.LANGWATCH_DASHBOARD_URL || secrets.LANGWATCH_DASHBOARD_URL || 'https://app.langwatch.ai' }}
          VOICE_AGENT_HEALTH_URL: ${{ vars.VOICE_AGENT_HEALTH_URL || secrets.VOICE_AGENT_HEALTH_URL || 'https://www.alexpavsky.com/api/health' }}
        run: |
          python .github/scripts/notify_observability_slack.py \
            --mode langwatch \
            --channel "$LANGWATCH_CHANNEL_ID" \
            --dashboard-url "$LANGWATCH_DASHBOARD_URL" \
            --health-url "$VOICE_AGENT_HEALTH_URL" \
            --check-outcome "${{ needs.agent-checks.outputs.voice }}" \
            --key-configured "${{ needs.agent-checks.outputs.langwatch_key }}" \
            --require-delivery

      - name: Enforce observability checks
        if: always()
        env:
          VOICE_OUTCOME: ${{ needs.agent-checks.outputs.voice }}
          LANGFUSE_OUTCOME: ${{ needs.agent-checks.outputs.langfuse }}
          LANGWATCH_KEY: ${{ needs.agent-checks.outputs.langwatch_key }}
          LANGFUSE_KEYS: ${{ needs.agent-checks.outputs.langfuse_keys }}
        run: |
          if [ "$VOICE_OUTCOME" != "success" ] || [ "$LANGFUSE_OUTCOME" != "success" ] || \
             [ "$LANGWATCH_KEY" != "true" ] || [ "$LANGFUSE_KEYS" != "true" ]; then
            echo "Observability gate failed: voice=$VOICE_OUTCOME langfuse=$LANGFUSE_OUTCOME langwatch_key=$LANGWATCH_KEY langfuse_keys=$LANGFUSE_KEYS"
            exit 1
          fi
