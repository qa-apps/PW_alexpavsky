name: Agent Observability Dashboards

on:
  workflow_dispatch:
    inputs:
      review_sha:
        description: "Optional commit SHA for an isolated cloud merge review"
        required: false
        type: string
  schedule:
    # Daily: run the voice Scenario (reports to LangWatch) and the chat trace
    # check (reads back from Langfuse), then post both statuses to Slack.
    - cron: "10 20 * * *"

concurrency:
  group: agent-observability-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cloud-merge-review:
    if: github.event_name == 'workflow_dispatch' && inputs.review_sha != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout review commit
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.review_sha }}
          fetch-depth: 0

      - name: Review exact diff with an independent OpenRouter model
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          REVIEW_SHA: ${{ inputs.review_sha }}
        run: |
          git fetch origin master --depth=1
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import sys
          import urllib.error
          import urllib.request

          diff = subprocess.check_output(
              ["git", "diff", "--no-ext-diff", f"origin/master...{os.environ['REVIEW_SHA']}"],
              text=True,
          )
          prompt = """Final merge gate. Review only blocking correctness or security bugs in this GitHub Actions diff, including bash, retry semantics, artifact/report gating, and daily-marker gating. Failed assertion reports are intentionally published, but the completion marker must require successful eval, artifacts, both Slack reports, and Pages. Reply with exactly APPROVE plus at most three brief bullets, or REJECT plus blocking findings.\n\nDIFF:\n""" + diff
          models = (
              "z-ai/glm-4.5-air",
              "deepseek/deepseek-v4.1-flash",
          )
          last_error = None
          for model in models:
              payload = json.dumps({
                  "model": model,
                  "messages": [{"role": "user", "content": prompt}],
                  "temperature": 0,
                  "max_tokens": 1800,
              }).encode()
              request = urllib.request.Request(
                  "https://openrouter.ai/api/v1/chat/completions",
                  data=payload,
                  headers={
                      "Authorization": f"Bearer {os.environ['OPENROUTER_API_KEY']}",
                      "Content-Type": "application/json",
                      "HTTP-Referer": "https://github.com/qa-apps/PW_alexpavsky",
                  },
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(request, timeout=180) as response:
                      body = json.load(response)
                  choice = body["choices"][0]
                  message = choice["message"]
                  verdict = (message.get("content") or message.get("reasoning") or "").strip()
                  usage = body.get("usage", {})
                  print(f"MODEL={body.get('model', model)}")
                  print(f"USAGE={json.dumps(usage, sort_keys=True)}")
                  if not verdict:
                      last_error = f"{model}: empty response ({choice.get('finish_reason')})"
                      print(f"::warning::{last_error}")
                      continue
                  print(verdict)
                  raise SystemExit(0 if verdict.startswith("APPROVE") else 1)
              except (urllib.error.HTTPError, urllib.error.URLError, TimeoutError, KeyError) as exc:
                  last_error = f"{model}: {exc}"
                  print(f"::warning::{last_error}")
          print(f"::error::No independent cloud reviewer answered: {last_error}")
          sys.exit(2)
          PY

  agent-checks:
    if: github.event_name != 'workflow_dispatch' || inputs.review_sha == ''
    name: Voice Scenario (LangWatch) + chat traces (Langfuse)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      voice: ${{ steps.voice.outcome }}
      langfuse: ${{ steps.langfuse.outcome }}
      langwatch_key: ${{ steps.keys.outputs.langwatch }}
      langfuse_keys: ${{ steps.keys.outputs.langfuse }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Detect backend keys
        id: keys
        env:
          LANGWATCH_API_KEY: ${{ secrets.LANGWATCH_API_KEY }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
        run: |
          echo "langwatch=$([ -n "$LANGWATCH_API_KEY" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "langfuse=$([ -n "$LANGFUSE_PUBLIC_KEY" ] && [ -n "$LANGFUSE_SECRET_KEY" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          [ -n "$LANGWATCH_API_KEY" ] || echo "::warning::LANGWATCH_API_KEY secret is missing; the voice Scenario runs but is not sent to LangWatch."
          [ -n "$LANGFUSE_PUBLIC_KEY" ] && [ -n "$LANGFUSE_SECRET_KEY" ] || echo "::warning::LANGFUSE_PUBLIC_KEY/LANGFUSE_SECRET_KEY secrets are missing; the Langfuse trace read-back is skipped."

      - name: Voice agent Scenario → LangWatch
        id: voice
        continue-on-error: true
        env:
          LANGWATCH_API_KEY: ${{ secrets.LANGWATCH_API_KEY }}
          LANGWATCH_ENDPOINT: ${{ vars.LANGWATCH_ENDPOINT || 'https://app.langwatch.ai' }}
          SCENARIO_BATCH_RUN_ID: gh-${{ github.run_id }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          # The repo's GROQ_API_KEY is rejected (Invalid API Key); OpenRouter works.
          SCENARIO_JUDGE_PROVIDER: ${{ vars.SCENARIO_JUDGE_PROVIDER || 'openrouter' }}
          SCENARIO_JUDGE_MODEL: ${{ vars.SCENARIO_JUDGE_MODEL || 'openai/gpt-oss-120b' }}
        run: npx vitest run tests/voice

      - name: Chat agent → Langfuse trace check
        id: langfuse
        continue-on-error: true
        env:
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          LANGFUSE_HOST: ${{ vars.LANGFUSE_HOST || 'https://us.cloud.langfuse.com' }}
        run: npx vitest run tests/observability

  slack-observability:
    needs: agent-checks
    if: always() && (github.event_name != 'workflow_dispatch' || inputs.review_sha == '')
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Notify Langfuse Slack channel
        if: always()
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          LANGFUSE_CHANNEL_ID: ${{ secrets.SLACK_LANGFUSE_CHANNEL_ID }}
          LANGFUSE_DASHBOARD_URL: ${{ vars.LANGFUSE_DASHBOARD_URL || secrets.LANGFUSE_DASHBOARD_URL || 'https://us.cloud.langfuse.com' }}
          ALEXPAVSKY_HEALTH_URL: ${{ vars.ALEXPAVSKY_HEALTH_URL || secrets.ALEXPAVSKY_HEALTH_URL || 'https://www.alexpavsky.com/api/health' }}
        run: |
          python .github/scripts/notify_observability_slack.py \
            --mode langfuse \
            --channel "$LANGFUSE_CHANNEL_ID" \
            --dashboard-url "$LANGFUSE_DASHBOARD_URL" \
            --health-url "$ALEXPAVSKY_HEALTH_URL" \
            --check-outcome "${{ needs.agent-checks.outputs.langfuse }}" \
            --key-configured "${{ needs.agent-checks.outputs.langfuse_keys }}"

      - name: Notify LangWatch Slack channel
        if: always()
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          LANGWATCH_CHANNEL_ID: ${{ secrets.SLACK_LANGWATCH_CHANNEL_ID }}
          LANGWATCH_DASHBOARD_URL: ${{ vars.LANGWATCH_DASHBOARD_URL || secrets.LANGWATCH_DASHBOARD_URL || 'https://app.langwatch.ai' }}
          VOICE_AGENT_HEALTH_URL: ${{ vars.VOICE_AGENT_HEALTH_URL || secrets.VOICE_AGENT_HEALTH_URL || 'https://www.alexpavsky.com/api/health' }}
        run: |
          python .github/scripts/notify_observability_slack.py \
            --mode langwatch \
            --channel "$LANGWATCH_CHANNEL_ID" \
            --dashboard-url "$LANGWATCH_DASHBOARD_URL" \
            --health-url "$VOICE_AGENT_HEALTH_URL" \
            --check-outcome "${{ needs.agent-checks.outputs.voice }}" \
            --key-configured "${{ needs.agent-checks.outputs.langwatch_key }}"
